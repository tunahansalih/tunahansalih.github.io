<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · Interview Prep</title>
  <script>
    window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root{--ink:#1a1a1a;--muted:#6b7280;--line:#e6e6e6;--accent:#c00;--panel:#fafafa}
    *{box-sizing:border-box}
    body{margin:0;color:var(--ink);background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.65}
    header{border-bottom:1px solid var(--line);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    header a{font-weight:650}
    header span{color:var(--muted);font-size:13px}
    main{max-width:780px;margin:0 auto;padding:32px 22px 72px}
    h1{font-size:30px;line-height:1.2;margin:0 0 22px}
    h2{font-size:21px;margin-top:34px}
    h3{font-size:17px;margin-top:26px}
    p,li{max-width:72ch}
    li{margin:7px 0}
    a{color:var(--accent);text-underline-offset:2px}
    pre{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em}
    table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}
    th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:8px 10px}
    blockquote{margin:20px 0;padding:4px 16px;border-left:3px solid var(--accent);color:#374151}
    .back{display:inline-block;color:var(--accent);text-decoration:none}
    @media(max-width:600px){main{padding:24px 17px 56px}h1{font-size:25px}header{padding:12px 16px}}
  </style>
</head>
<body>
  <header><a class="back" href="{{ '/interview-prep/#dash' | relative_url }}">← Interview prep</a><span>Practice sheet</span></header>
  <main>{{ content }}</main>
</body>
</html>
