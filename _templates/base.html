<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{title}}</title>
  <meta name="description" content="{{page_description}}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://tmeral.com{{page_url}}">

  <!-- Open Graph / Twitter -->
  <meta property="og:locale" content="en_US">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{page_description}}">
  <meta property="og:url" content="https://tmeral.com{{page_url}}">
  <meta property="og:site_name" content="Tuna Meral">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{page_description}}">
  <meta name="twitter:site" content="@tunahansalih">

  <!-- Icons and Styles -->
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="shortcut icon" href="/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body class="page">

  <header class="main-header academic-header">
  <div class="navigation-wrapper">
    <div class="site-name">
      <a href="/" class="site-mark" aria-label="Tuna Meral">
        <img src="/favicon.png" alt="" aria-hidden="true">
      </a>
    </div>

    <div class="nav-controls">
      <nav role="navigation" class="site-nav" aria-label="Main navigation">
        <button class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav-menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <ul id="nav-menu" class="nav-menu">
            <li class="nav-item{{nav_active_home}}">
              <a href="/" class="nav-link">
                Home
              </a>
            </li>
            <li class="nav-item{{nav_active_publications}}">
              <a href="/publications/" class="nav-link">
                Publications
              </a>
            </li>
            <li class="nav-item{{nav_active_news}}">
              <a href="/news/" class="nav-link">
                News
              </a>
            </li>
            <li class="nav-item{{nav_active_resume}}">
              <a href="/resume/" class="nav-link">
                Resume
              </a>
            </li>
        </ul>
      </nav>

    </div>
  </div>
  <div class="header-separator"></div>
</header>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const navToggle = document.querySelector('.nav-toggle');
    const navMenu = document.querySelector('.nav-menu');

    if (navToggle && navMenu) {
      navToggle.addEventListener('click', function () {
        const isExpanded = navToggle.getAttribute('aria-expanded') === 'true';
        navToggle.setAttribute('aria-expanded', !isExpanded);
        navMenu.classList.toggle('active');
      });

      document.addEventListener('click', function (event) {
        if (!navToggle.contains(event.target) && !navMenu.contains(event.target)) {
          navMenu.classList.remove('active');
          navToggle.setAttribute('aria-expanded', 'false');
        }
      });

      const navLinks = document.querySelectorAll('.nav-link');
      navLinks.forEach(function (link) {
        link.addEventListener('click', function () {
          navMenu.classList.remove('active');
          navToggle.setAttribute('aria-expanded', 'false');
        });
      });
    }

  });
</script>

  <div id="main" role="main">
    <div class="article-author-side">
{{profile_card}}
{{sidebar_extra}}
    </div>
    <article class="page">
{{page_header}}
      <div class="article-wrap">
{{content}}
      </div>
    </article>
  </div>

  <div class="footer-wrap">
    <footer>
      <span>&copy; 2026 Tuna Meral.</span>
    </footer>
  </div>

<script src="https://www.w3counter.com/tracker.js?id=135831" async></script>
</body>
</html>
