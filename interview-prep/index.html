<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A concrete, ADHD-friendly preparation system for PhD-level Research Scientist and Research Engineer interviews.">
<title>Research Interview Lab</title>
<style>
:root{
  --paper:#f5f3ed;
  --surface:#fffefa;
  --surface-2:#ece9df;
  --ink:#17201c;
  --muted:#647069;
  --line:#d9d6cc;
  --accent:#245c48;
  --accent-2:#d8643b;
  --accent-soft:#e2eee8;
  --warn:#8a531d;
  --warn-soft:#f6ead8;
  --danger:#a33b32;
  --danger-soft:#f8e6e2;
  --shadow:0 18px 50px rgba(31,42,36,.08);
  --radius:18px;
  --radius-sm:11px;
  --max:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 0%,rgba(36,92,72,.08),transparent 30rem),
    radial-gradient(circle at 90% 10%,rgba(216,100,59,.06),transparent 26rem),
    var(--paper);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit}
button{color:inherit}
a{color:var(--accent);text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
.skip-link{position:fixed;left:16px;top:-80px;z-index:100;background:var(--ink);color:white;padding:10px 14px;border-radius:8px}
.skip-link:focus{top:12px}
.site-header{
  position:sticky;
  top:0;
  z-index:30;
  border-bottom:1px solid rgba(217,214,204,.9);
  background:rgba(245,243,237,.92);
  backdrop-filter:blur(18px);
}
.header-inner{max-width:var(--max);margin:auto;padding:15px 24px 0}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--ink);color:white;font-weight:800;letter-spacing:-.03em;flex:none}
.brand-copy{min-width:0}
.brand-copy strong{display:block;font-size:15px;letter-spacing:-.01em}
.brand-copy span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-status{display:flex;align-items:center;gap:14px;min-width:min(360px,42vw)}
.status-copy{min-width:98px;text-align:right}
.status-copy strong,.status-copy span{display:block}
.status-copy strong{font-size:13px}
.status-copy span{font-size:11px;color:var(--muted)}
.header-progress{height:7px;flex:1;background:#dedbd1;border-radius:999px;overflow:hidden}
.header-progress i{display:block;width:0;height:100%;background:var(--accent);border-radius:inherit;transition:width .25s ease}
.main-nav{display:flex;gap:4px;overflow:auto;margin-top:12px;scrollbar-width:none}
.main-nav::-webkit-scrollbar{display:none}
.nav-btn{
  appearance:none;
  border:0;
  border-bottom:3px solid transparent;
  background:transparent;
  padding:10px 12px 11px;
  color:var(--muted);
  cursor:pointer;
  font-size:13px;
  font-weight:720;
  white-space:nowrap;
}
.nav-btn:hover{color:var(--ink)}
.nav-btn.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:var(--max);margin:auto;padding:34px 24px 90px}
.view{display:none}
.view.on{display:block}
.page-head{max-width:700px;margin-bottom:16px}
.eyebrow{
  margin:0 0 7px;
  color:var(--accent);
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
}
h1,h2,h3,h4,p{margin-top:0}
h1,h2,h3{letter-spacing:-.025em}
.page-head h1{font-size:clamp(26px,3vw,36px);line-height:1.08;margin-bottom:0;max-width:700px}
.card{
  background:rgba(255,254,250,.95);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 1px 0 rgba(23,32,28,.02);
}
.focus-shell{max-width:780px;margin:0 auto}
.focus-context{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 3px 10px;color:var(--muted);font-size:12px;font-weight:700}
.today-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(260px,.75fr);gap:20px;align-items:start}
.task-card{overflow:hidden;box-shadow:var(--shadow)}
.task-top{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.task-kicker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;background:var(--surface-2);padding:4px 9px;color:var(--muted);font-size:11px;font-weight:750}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.tag.orange{background:#fae8e0;color:#9a4428}
.task-top h2{font-size:clamp(23px,3.5vw,31px);line-height:1.1;margin-bottom:7px}
.artifact{margin:0;color:var(--muted)}
.artifact strong{color:var(--ink)}
.task-body{padding:20px 22px}
.session-section{margin:0 0 16px}
.session-section .detail-label{margin:0 0 5px}
.step-checklist{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 0}
.rescue-action{margin:0;padding:12px 14px;border-left:3px solid var(--accent-2);background:#faeee8;border-radius:0 9px 9px 0;font-weight:650}
.need-row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.need-row .label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:5px}
.resource-link{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:white;border-radius:999px;padding:5px 10px;text-decoration:none;font-size:12px;font-weight:700}
.resource-link:hover{border-color:var(--accent)}
.step-panel{
  padding:20px;
  border-radius:15px;
  background:var(--ink);
  color:white;
  min-height:160px;
}
.step-label{color:#b8cec4;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px}
.step-panel h3{font-size:20px;line-height:1.3;margin:0 0 17px;max-width:700px}
.step-actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{
  appearance:none;
  border:1px solid var(--line);
  border-radius:10px;
  background:white;
  padding:9px 14px;
  font-weight:750;
  font-size:13px;
  cursor:pointer;
  transition:transform .12s ease,border-color .12s ease,background .12s ease;
}
.btn:hover{border-color:#9b9a92}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.btn.primary:hover{background:#1d4d3b}
.btn.warm{background:var(--accent-2);border-color:var(--accent-2);color:white}
.btn.ghost{background:transparent}
.btn.invert{background:white;border-color:white;color:var(--ink)}
.btn.small{padding:6px 10px;font-size:12px}
.btn.danger{color:var(--danger);border-color:#e6bcb6}
.btn:disabled{opacity:.48;cursor:not-allowed}
.timer{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin:13px 0 15px;
  padding:11px 13px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fbfaf5;
}
.timer-time{font-variant-numeric:tabular-nums;font-size:23px;font-weight:800;letter-spacing:-.04em;min-width:78px}
.timer-copy{flex:1;min-width:150px}
.timer-copy strong,.timer-copy span{display:block}
.timer-copy strong{font-size:12px}
.timer-copy span{font-size:11px;color:var(--muted)}
.timer-actions{display:flex;gap:7px}
.finish-line{border-left:3px solid var(--accent);padding:8px 11px;background:var(--accent-soft);border-radius:0 9px 9px 0;margin:0 0 14px}
.finish-line span{display:block;color:var(--accent);font-size:10px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.finish-line p{margin:0;font-size:14px;font-weight:650}
.task-footer{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.task-footer .spacer{flex:1}
details{border-top:1px solid var(--line)}
details summary{cursor:pointer;list-style:none;font-size:13px;font-weight:750;color:var(--muted)}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"＋";margin-right:7px;color:var(--accent)}
details[open] summary::before{content:"−"}
.task-details{margin-top:16px;padding-top:13px}
.all-steps{margin:12px 0 0;padding:0;list-style:none;counter-reset:steps}
.all-steps li{counter-increment:steps;display:flex;gap:10px;padding:7px 0;color:var(--muted);font-size:13px}
.all-steps li::before{content:counter(steps);display:grid;place-items:center;width:22px;height:22px;flex:none;border-radius:7px;background:var(--surface-2);color:var(--ink);font-size:11px;font-weight:800}
.all-steps li.done{text-decoration:line-through;opacity:.65}
.detail-label{margin:13px 0 5px;color:var(--muted);font-size:10px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}
.input-list{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.input-list li{margin:3px 0}
.notes{width:100%;min-height:110px;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:white;resize:vertical}
.week-rail{padding:18px;position:sticky;top:120px}
.session-strip{display:flex;align-items:center;gap:7px;margin-top:12px;padding:9px 11px;overflow:auto}
.session-strip>span{font-size:11px;color:var(--muted);font-weight:750;margin-right:2px;white-space:nowrap}
.session-dot{display:grid;place-items:center;min-width:34px;height:31px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:11px;font-weight:800;cursor:pointer}
.session-dot.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.session-dot.done{background:var(--accent);border-color:var(--accent);color:white}
.rail-head{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-bottom:12px}
.rail-head h3{font-size:16px;margin:0}
.rail-head span{font-size:11px;color:var(--muted)}
.rail-list{display:grid;gap:7px}
.rail-task{
  width:100%;
  display:grid;
  grid-template-columns:27px minmax(0,1fr);
  gap:9px;
  align-items:start;
  border:1px solid transparent;
  background:transparent;
  border-radius:11px;
  padding:9px;
  text-align:left;
  cursor:pointer;
}
.rail-task:hover{background:var(--paper)}
.rail-task.on{background:var(--accent-soft);border-color:#c8ded3}
.rail-task.done .rail-title{text-decoration:line-through;color:var(--muted)}
.rail-num{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;background:var(--surface-2);font-size:11px;font-weight:800}
.rail-task.done .rail-num{background:var(--accent);color:white}
.rail-title{display:block;font-size:12px;font-weight:750;line-height:1.35}
.rail-meta{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.rail-rule{margin:15px 2px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
.notice{padding:14px 16px;border:1px solid #e8d0ae;background:var(--warn-soft);color:#65401b;border-radius:12px;margin-bottom:18px;font-size:13px}
.notice strong{color:#4e3014}
.success-card{text-align:center;padding:48px 26px}
.success-mark{display:grid;place-items:center;width:58px;height:58px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-size:26px;font-weight:900;margin:0 auto 16px}
.success-card h2{font-size:28px;margin-bottom:8px}
.success-card p{color:var(--muted);max-width:520px;margin:0 auto 20px}
.section-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:24px}
.mini-card{padding:17px}
.mini-card b{display:block;font-size:20px;letter-spacing:-.03em}
.mini-card span{font-size:12px;color:var(--muted)}
.week-card{margin-bottom:11px;overflow:hidden}
.week-card>summary{border:0;padding:17px 19px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;color:var(--ink)}
.week-card>summary::before{display:none}
.week-summary-title{font-size:16px;font-weight:800;display:block}
.week-summary-sub{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.week-badge{font-size:11px;background:var(--surface-2);padding:5px 9px;border-radius:999px;white-space:nowrap}
.week-card[open] .week-badge{background:var(--accent-soft);color:var(--accent)}
.week-body{border-top:1px solid var(--line);padding:9px 18px 16px}
.road-task{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid #ece9e1}
.road-task:last-child{border-bottom:0}
.road-day{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}
.road-title{font-size:13px;font-weight:750}
.road-meta{font-size:11px;color:var(--muted);margin-top:2px}
.status-chip{font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.status-chip.pass{background:var(--accent-soft);color:var(--accent)}
.status-chip.repair{background:var(--warn-soft);color:var(--warn)}
.status-chip.missed{background:var(--danger-soft);color:var(--danger)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filter-btn{border:1px solid var(--line);background:var(--surface);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:750;cursor:pointer}
.filter-btn.on{background:var(--ink);border-color:var(--ink);color:white}
.toolbar .spacer{flex:1}
.drill-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.drill-card{padding:16px;display:flex;flex-direction:column;min-height:132px}
.drill-card h3{font-size:18px;line-height:1.2;margin:10px 0 6px}
.drill-card p{font-size:12px;color:var(--muted);flex:1}
.drill-card .btn{align-self:flex-start}
.drill-run{max-width:820px}
.drill-prompt{font-size:20px;line-height:1.45;margin:18px 0;padding:22px;border-radius:14px;background:var(--ink);color:white}
.followups{padding-left:20px}
.followups li{margin:7px 0}
.check-box{padding:14px 16px;background:var(--accent-soft);border-radius:12px;margin:18px 0;font-size:13px}
.rubric-list{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:12px}
.rubric-list li{margin:7px 0}
.rubric-list strong{color:var(--ink)}
.score-actions{display:flex;gap:8px;flex-wrap:wrap}
.score-actions .btn.on{outline:3px solid rgba(36,92,72,.2);border-color:var(--accent)}
.readiness-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.readiness-summary .card{padding:18px}
.readiness-summary b{display:block;font-size:28px;letter-spacing:-.04em}
.readiness-summary span{font-size:11px;color:var(--muted)}
.gate-list{display:grid;gap:11px}
.gate-card{padding:0;overflow:hidden}
.gate-top{display:flex;justify-content:space-between;gap:12px}
.gate-card>.gate-top{padding:15px 17px;align-items:center;color:var(--ink)}
.gate-card>.gate-top::before{display:none}
.gate-card[open]>.gate-top{border-bottom:1px solid var(--line)}
.gate-card>.gate-pass,.gate-card>.score-actions,.gate-card>.notes{margin-left:17px;margin-right:17px}
.gate-card>.notes{width:calc(100% - 34px);margin-bottom:17px}
.gate-card>.task-details{margin:14px 17px;padding-top:12px}
.gate-top h3{font-size:16px;margin:0}
.gate-pass{font-size:13px;color:var(--muted);margin:10px 0 14px}
.lane-table{width:100%;border-collapse:collapse;font-size:13px}
.lane-table th,.lane-table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.lane-table th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.interview-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(290px,.8fr);gap:18px;align-items:start}
.form-card,.source-card,.rules-card{padding:21px}
.field{margin-bottom:15px}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  background:white;
  padding:10px 11px;
  color:var(--ink);
}
.field textarea{min-height:110px;resize:vertical}
.help{font-size:11px;color:var(--muted);margin-top:5px}
.company-card{padding:15px;margin-bottom:9px}
.company-card h3{font-size:14px;margin-bottom:5px}
.company-card p{font-size:12px;color:var(--muted);margin-bottom:7px}
.compact-details{padding:0;overflow:hidden}
.compact-details>summary{padding:15px 17px;color:var(--ink)}
.compact-details>summary::before{display:none}
.compact-details>summary::after{content:"＋";float:right;color:var(--accent)}
.compact-details[open]>summary::after{content:"−"}
.compact-details[open]>summary{border-bottom:1px solid var(--line)}
.compact-body{padding:15px 17px}
.protocol-head{padding:20px 22px;margin-bottom:15px;border:2px solid var(--accent);background:var(--accent-soft)}
.protocol-head h2{margin-bottom:5px}
.protocol-head p{color:var(--muted);margin-bottom:0}
.protocol-card{margin-bottom:11px;overflow:hidden;border-top:1px solid var(--line)}
.protocol-card.current{border-color:var(--accent);box-shadow:0 0 0 2px rgba(36,92,72,.08)}
.protocol-title{padding:15px 17px;display:block;color:var(--ink)}
.protocol-title::before{display:none}
.protocol-title::after{content:"＋";float:right;color:var(--accent)}
.protocol-card[open]>.protocol-title::after{content:"−"}
.protocol-title span{font-size:10px;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.protocol-title h3{font-size:18px;margin:3px 0 0}
.protocol-actions{border-top:1px solid var(--line);padding:10px 18px 16px}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.check-row input{width:17px;height:17px;margin-top:3px;accent-color:var(--accent);flex:none}
.check-row label{font-size:13px;cursor:pointer}
.check-row.done label{text-decoration:line-through;color:var(--muted)}
.setup-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:15px;margin-bottom:22px}
.source-list{display:grid;gap:10px}
.source-row{padding:14px 0;border-bottom:1px solid var(--line)}
.source-row:last-child{border-bottom:0}
.source-row b,.source-row span{display:block}
.source-row b{font-size:13px}
.source-row span{font-size:11px;color:var(--muted);margin:2px 0 4px}
.rules-list{padding-left:20px;margin-bottom:0}
.rules-list li{margin:9px 0;font-size:13px}
.storage-note{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}
.storage-note::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.inline-empty{padding:30px;text-align:center;color:var(--muted)}
.footer-note{margin-top:32px;color:var(--muted);font-size:11px;text-align:center}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid rgba(216,100,59,.4);outline-offset:2px}
@media(max-width:850px){
  .today-grid,.interview-layout{grid-template-columns:1fr}
  .week-rail{position:static;order:-1}
  .section-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:620px){
  body{font-size:15px}
  .header-inner{padding:11px 14px 0}
  .brand-copy span{max-width:190px}
  .header-status{min-width:0;flex:0}
  .header-progress{display:none}
  .status-copy span{display:none}
  .main-nav{margin-left:-4px;margin-right:-4px}
  .nav-btn{padding:9px 9px 10px;font-size:12px}
  main{padding:26px 14px 78px}
  .page-head h1{font-size:34px}
  .task-top,.task-body{padding:20px}
  .step-panel{padding:18px;min-height:170px}
  .step-panel h3{font-size:19px}
  .timer-time{font-size:24px}
  .drill-grid,.setup-grid{grid-template-columns:1fr}
  .section-grid,.readiness-summary{grid-template-columns:1fr}
  .road-task{grid-template-columns:37px minmax(0,1fr)}
  .road-task .btn{grid-column:2;justify-self:start}
  .lane-table{font-size:11px}
  .lane-table th,.lane-table td{padding:8px 5px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to preparation task</a>
<header class="site-header">
  <div class="header-inner">
    <div class="brand-row">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">RI</div>
        <div class="brand-copy">
          <strong>Research Interview Lab</strong>
          <span id="role-label">RS + RE prep</span>
        </div>
      </div>
      <div class="header-status" aria-label="Current plan status">
        <div class="status-copy">
          <strong id="week-label">Loading…</strong>
          <span id="week-progress-label">Your progress is saved here</span>
        </div>
        <div class="header-progress" role="progressbar" aria-label="Current week progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="week-progress"></i></div>
      </div>
    </div>
    <nav class="main-nav" id="nav" aria-label="Preparation sections"></nav>
  </div>
</header>

<main id="main" tabindex="-1">
  <section class="view on" id="view-today"></section>
  <section class="view" id="view-roadmap"></section>
  <section class="view" id="view-practice"></section>
  <section class="view" id="view-readiness"></section>
  <section class="view" id="view-interview"></section>
  <section class="view" id="view-setup"></section>
</main>

<input id="import-file" type="file" accept="application/json" hidden>
<div id="live-region" class="skip-link" aria-live="polite" aria-atomic="true"></div>

<script>
(function(){
"use strict";

var PLAN=null;
var KEY="research_interview_lab_v5";
var S=null;
var activeView="today";
var activeCategory="All";
var ticker=null;
var TABS=[
  ["today","Today"],
  ["roadmap","Plan"],
  ["practice","Practice"],
  ["readiness","Gates"],
  ["interview","Interview"],
  ["setup","Settings"]
];

function esc(value){
  return String(value==null?"":value).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function todayKey(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function nextMondayKey(){
  var d=new Date();
  var add=(8-d.getDay())%7;
  d.setDate(d.getDate()+add);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function freshState(){
  return {
    version:5,
    startDate:nextMondayKey(),
    targetDate:PLAN.defaultTargetDate,
    role:"both",
    completed:{},
    stepDone:{},
    minimum:{},
    notes:{},
    selectedTask:"",
    selectedAtWeek:-1,
    gateResults:{},
    gateNotes:{},
    drillResults:{},
    activeDrill:"",
    interview:{active:false,company:"",role:"Research Scientist / Research Engineer",date:"",format:"",focus:"",checks:{},sprint:"",sprintChoices:{},contractKey:"",runId:""},
    timer:{id:"",remaining:0,running:false,startedAt:0}
  };
}
function loadState(){
  var base=freshState();
  try{
    var saved=JSON.parse(localStorage.getItem(KEY)||"null");
    if(saved&&saved.version===5){
      Object.keys(saved).forEach(function(k){base[k]=saved[k];});
      base.interview=Object.assign(freshState().interview,saved.interview||{});
      base.timer=Object.assign(freshState().timer,saved.timer||{});
    }
  }catch(err){}
  return base;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(err){}
}
function announce(text){
  var node=document.getElementById("live-region");
  node.textContent=text;
}
function parseDate(key){
  return new Date(key+"T12:00:00");
}
function dayDiff(a,b){
  return Math.floor((a-b)/86400000);
}
function elapsedWeekIndex(){
  var start=parseDate(S.startDate);
  var now=parseDate(todayKey());
  if(now<start)return 0;
  return Math.max(0,Math.floor(dayDiff(now,start)/7));
}
function weekIndex(){
  return Math.min(PLAN.weeks.length-1,elapsedWeekIndex());
}
function weekDates(index){
  var start=parseDate(S.startDate);
  start.setDate(start.getDate()+index*7);
  var end=new Date(start);
  end.setDate(end.getDate()+6);
  var fmt=new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric"});
  return fmt.format(start)+"–"+fmt.format(end);
}
function allTasks(){
  var out=[];
  PLAN.weeks.forEach(function(w,wi){
    w.sessions.forEach(function(t,ti){out.push({task:t,week:w,weekIndex:wi,taskIndex:ti});});
  });
  return out;
}
function findTask(id){
  var fixed=allTasks().find(function(x){return x.task.id===id;});
  if(fixed)return fixed;
  var wi=elapsedWeekIndex();
  if(wi>=PLAN.weeks.length){
    var w=maintenanceWeek(wi);
    var task=w.sessions.find(function(t){return t.id===id;});
    if(task)return {task:task,week:w,weekIndex:wi,taskIndex:w.sessions.indexOf(task)};
  }
  return null;
}
function currentWeek(){
  var wi=elapsedWeekIndex();
  return wi<PLAN.weeks.length?PLAN.weeks[wi]:maintenanceWeek(wi);
}
function maintenanceWeek(wi){
  var number=wi-PLAN.weeks.length+1;
  var due=PLAN.maintenance.filter(function(t){
    if(/^Every other /.test(t.cadence||""))return number%2===1;
    if(/^Monthly/.test(t.cadence||""))return (number-1)%4===0;
    return true;
  });
  return {
    id:"maintenance-"+number,
    title:"Maintenance week "+number,
    outcome:"Keep retrieval, coding, implementation, targeting, and one mock alive without rebuilding the syllabus.",
    maintenance:true,
    sessions:due.map(function(t){
      return Object.assign({},t,{id:"M"+number+"-"+t.id.replace("MM-","")});
    })
  };
}
function weekDoneCount(w){
  return w.sessions.filter(function(t){return !!S.completed[t.id];}).length;
}
function firstIncomplete(w){
  return w.sessions.find(function(t){return !S.completed[t.id];})||null;
}
function displayRole(){
  if(S.role==="rs")return "Research Scientist";
  if(S.role==="re")return "Research Engineer";
  return "Research Scientist + Research Engineer";
}
function currentTaskRecord(){
  if(S.selectedTask&&S.selectedAtWeek===elapsedWeekIndex()){
    var selected=findTask(S.selectedTask);
    if(selected)return selected;
  }
  var wi=elapsedWeekIndex();
  var w=currentWeek();
  var task=firstIncomplete(w)||w.sessions[w.sessions.length-1];
  return {task:task,week:w,weekIndex:wi,taskIndex:w.sessions.indexOf(task)};
}
function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML="";
  TABS.forEach(function(item){
    var b=document.createElement("button");
    b.className="nav-btn";
    b.type="button";
    b.id="nav-"+item[0];
    b.textContent=item[1];
    b.addEventListener("click",function(){show(item[0]);});
    nav.appendChild(b);
  });
}
function show(id){
  if(!document.getElementById("view-"+id))id="today";
  activeView=id;
  document.querySelectorAll(".view").forEach(function(v){v.classList.remove("on");});
  document.querySelectorAll(".nav-btn").forEach(function(b){b.classList.remove("on");b.removeAttribute("aria-current");});
  document.getElementById("view-"+id).classList.add("on");
  var tab=document.getElementById("nav-"+id);
  tab.classList.add("on");
  tab.setAttribute("aria-current","page");
  renderView(id);
  history.replaceState(null,"","#"+id);
  window.scrollTo(0,0);
}
function renderView(id){
  if(id==="today")renderToday();
  if(id==="roadmap")renderRoadmap();
  if(id==="practice")renderPractice();
  if(id==="readiness")renderReadiness();
  if(id==="interview")renderInterview();
  if(id==="setup")renderSetup();
  renderHeader();
}
function renderHeader(){
  var w=currentWeek();
  var done=weekDoneCount(w);
  var pct=Math.round(done/w.sessions.length*100);
  var wi=elapsedWeekIndex();
  var phaseLabel=wi<PLAN.weeks.length?("Week "+(wi+1)+" of "+PLAN.weeks.length):("Maintenance "+(wi-PLAN.weeks.length+1));
  document.getElementById("week-label").textContent=S.interview.active?"Interview mode":phaseLabel;
  document.getElementById("week-progress-label").textContent=S.interview.active?(S.interview.company||"Weekly plan paused"):(done+"/"+w.sessions.length+" sessions · "+weekDates(wi));
  document.getElementById("week-progress").style.width=pct+"%";
  document.querySelector(".header-progress").setAttribute("aria-valuenow",String(pct));
  document.getElementById("role-label").textContent=displayRole()+" prep";
}
function pageHead(eyebrow,title,copy){
  return '<div class="page-head"><p class="eyebrow">'+esc(eyebrow)+'</p><h1>'+esc(title)+'</h1></div>';
}
function groundingLabel(value){
  if(value==="External public exercise")return "Sourced exercise";
  if(value==="External authoritative reference")return "Official example";
  if(value==="Source-grounded simulation")return "Grounded simulation";
  return value||"Source-backed";
}
function externalResourceLinks(resources){
  if(!resources||!resources.length)return "";
  return '<div class="need-row"><span class="label">Source</span>'+resources.map(function(link){
    return '<a class="resource-link" href="'+esc(link.url)+'" target="_blank" rel="noopener">'+esc(link.label)+' ↗</a>';
  }).join("")+'</div>';
}
function taskStatus(task,wi){
  if(S.completed[task.id])return {text:"Done",cls:"pass"};
  if(wi<elapsedWeekIndex())return {text:"Archived",cls:"missed"};
  return {text:"Not done",cls:""};
}
function timerRemaining(){
  if(!S.timer.running)return Math.max(0,S.timer.remaining||0);
  return Math.max(0,(S.timer.remaining||0)-Math.floor((Date.now()-S.timer.startedAt)/1000));
}
function timerLabel(seconds){
  var m=Math.floor(seconds/60);
  var s=seconds%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function setTimer(id,minutes,run){
  S.timer={id:id,remaining:Math.max(1,minutes)*60,running:!!run,startedAt:run?Date.now():0};
  save();
  startTicker();
}
function pauseTimer(){
  S.timer.remaining=timerRemaining();
  S.timer.running=false;
  S.timer.startedAt=0;
  save();
  paintTimer();
}
function toggleTimer(id,minutes){
  if(S.timer.id!==id){setTimer(id,minutes,true);return;}
  if(S.timer.running){pauseTimer();return;}
  if(timerRemaining()<=0)S.timer.remaining=minutes*60;
  S.timer.running=true;
  S.timer.startedAt=Date.now();
  save();
  startTicker();
  paintTimer();
}
function resetTimer(id,minutes){
  setTimer(id,minutes,false);
  paintTimer();
}
function startTicker(){
  if(ticker)clearInterval(ticker);
  ticker=setInterval(function(){
    if(!S||!S.timer.running)return;
    var left=timerRemaining();
    if(left<=0){
      S.timer.remaining=0;
      S.timer.running=false;
      S.timer.startedAt=0;
      save();
      announce("Focus block finished. Stand up, drink water, and decide whether the finish line is true.");
    }
    paintTimer();
  },1000);
}
function paintTimer(){
  var node=document.querySelector("[data-timer-id]");
  if(!node||node.getAttribute("data-timer-id")!==S.timer.id)return;
  var left=timerRemaining();
  var time=node.querySelector(".timer-time");
  var start=node.querySelector("[data-timer-toggle]");
  var msg=node.querySelector("[data-timer-message]");
  if(time)time.textContent=timerLabel(left);
  if(start)start.textContent=S.timer.running?"Pause":"Start";
  if(msg)msg.textContent=left<=0?"Block finished. Stand up before choosing another.":(S.timer.running?"Timer keeps running if you change tabs.":"One focus block. The full session may use two.");
}
function timerHtml(id,minutes){
  if(S.timer.id!==id)setTimer(id,minutes,false);
  return '<div class="timer" data-timer-id="'+esc(id)+'">'+
    '<div class="timer-time">'+timerLabel(timerRemaining())+'</div>'+
    '<div class="timer-copy"><strong>'+minutes+'-minute focus block</strong><span data-timer-message>'+(S.timer.running?"Timer keeps running if you change tabs.":"One focus block. The full session may use two.")+'</span></div>'+
    '<div class="timer-actions"><button class="btn small primary" type="button" data-timer-toggle>'+(S.timer.running?"Pause":"Start")+'</button><button class="btn small" type="button" data-timer-reset>Reset</button></div>'+
  '</div>';
}
function bindTimer(root,id,minutes){
  var toggle=root.querySelector("[data-timer-toggle]");
  var reset=root.querySelector("[data-timer-reset]");
  if(toggle)toggle.addEventListener("click",function(){toggleTimer(id,minutes);});
  if(reset)reset.addEventListener("click",function(){resetTimer(id,minutes);});
}
function selectTask(id){
  S.selectedTask=id;
  S.selectedAtWeek=elapsedWeekIndex();
  save();
  show("today");
}
function renderToday(){
  var root=document.getElementById("view-today");
  if(S.interview.active){renderInterviewToday(root);return;}
  var rec=currentTaskRecord();
  var task=rec.task;
  var week=rec.week;
  var minimum=!!S.minimum[task.id];
  var done=!!S.completed[task.id];
  var steps=S.stepDone[task.id]||[];

  if(done){
    root.innerHTML='<div class="focus-shell"><div class="card success-card"><div class="success-mark">✓</div><h2>Session complete</h2><p>'+esc(task.title)+'</p><button class="btn" id="continue-anyway" type="button">Open next session</button></div></div>';
    var next=week.sessions.find(function(t){return !S.completed[t.id];});
    var c=document.getElementById("continue-anyway");
    if(!next){c.textContent="Open the plan";c.onclick=function(){show("roadmap");};}
    else c.onclick=function(){selectTask(next.id);};
    return;
  }

  var timerMinutes=minimum?10:task.focus;
  var stepList=task.steps.map(function(step,i){
    var id="task-step-"+i;
    return '<div class="check-row '+(steps[i]?"done":"")+'"><input id="'+id+'" type="checkbox" data-task-step="'+i+'" '+(steps[i]?"checked":"")+'><label for="'+id+'">'+esc(step)+'</label></div>';
  }).join("");
  var inputList=(task.inputs||[]).map(function(item){return '<li>'+esc(item)+'</li>';}).join("");
  var laneTag=task.lane!=="common"?'<span class="tag">'+esc(task.lane.toUpperCase())+'</span>':"";
  var workBlock=minimum?'<section class="session-section"><p class="detail-label">10-minute version</p><p class="rescue-action">'+esc(task.rescue)+'</p></section>':'<section class="session-section"><p class="detail-label">Steps</p><div class="step-checklist">'+stepList+'</div></section>';
  var doneText=minimum?"Complete the 10-minute action, then stop.":task.done;

  root.innerHTML='<div class="focus-shell"><article class="card task-card">'+
    '<div class="task-top"><div class="task-kicker"><span class="tag accent">'+esc(task.day)+'</span><span class="tag">'+task.minutes+' min</span>'+laneTag+'<span class="tag">'+esc(groundingLabel(task.grounding))+'</span>'+(minimum?'<span class="tag orange">10-minute version</span>':"")+'</div><h2>'+esc(task.title)+'</h2><p class="artifact"><strong>Make:</strong> '+esc(task.artifact)+'</p></div>'+
    '<div class="task-body">'+externalResourceLinks(task.links)+(inputList?'<section class="session-section"><p class="detail-label">Prepare</p><ul class="input-list">'+inputList+'</ul></section>':"")+workBlock+
      timerHtml(task.id,timerMinutes)+'<div class="finish-line"><span>Done when</span><p>'+esc(doneText)+'</p></div>'+
      '<div class="task-footer"><button class="btn primary" type="button" id="complete-task">'+(minimum?"Mark 10-minute version complete":"Mark session complete")+'</button><button class="btn ghost" type="button" id="minimum-toggle">'+(minimum?"Return to full session":"Use 10-minute version")+'</button></div>'+
      '<details class="task-details"><summary>Notes (optional)</summary><textarea class="notes" id="task-notes" aria-label="Session notes" placeholder="Artifact link or a brief note…">'+esc(S.notes[task.id]||"")+'</textarea></details>'+
    '</div></article></div>';

  root.querySelectorAll("[data-task-step]").forEach(function(box){
    box.onchange=function(){
      var index=Number(box.getAttribute("data-task-step"));
      var arr=S.stepDone[task.id]||[];
      arr[index]=box.checked;
      S.stepDone[task.id]=arr;
      box.closest(".check-row").classList.toggle("done",box.checked);
      save();
    };
  });
  document.getElementById("complete-task").onclick=function(){
    S.completed[task.id]=true;
    pauseTimer();
    save();
    renderToday();
    renderHeader();
    announce(minimum?"Ten-minute version complete.":"Session complete.");
  };
  document.getElementById("minimum-toggle").onclick=function(){
    S.minimum[task.id]=!minimum;
    save();
    setTimer(task.id,S.minimum[task.id]?10:task.focus,false);
    renderToday();
  };
  document.getElementById("task-notes").addEventListener("input",function(e){S.notes[task.id]=e.target.value;save();});
  bindTimer(root,task.id,timerMinutes);
  bindRail(root);
}
function sessionStrip(week,activeId){
  return '<nav class="card session-strip" aria-label="This week"><span>This week</span>'+week.sessions.map(function(t,i){
    var label=S.completed[t.id]?"✓":String(i+1);
    return '<button type="button" class="session-dot '+(t.id===activeId?"on ":"")+(S.completed[t.id]?"done":"")+'" data-task="'+esc(t.id)+'" aria-label="'+esc(t.day+": "+t.title)+'" title="'+esc(t.title)+'">'+label+'</button>';
  }).join("")+'</nav>';
}
function weekRail(week,wi,activeId){
  var done=weekDoneCount(week);
  var items=week.sessions.map(function(t,i){
    return '<button type="button" class="rail-task '+(t.id===activeId?"on ":"")+(S.completed[t.id]?"done":"")+'" data-task="'+esc(t.id)+'">'+
      '<span class="rail-num">'+(S.completed[t.id]?"✓":(i+1))+'</span><span><span class="rail-title">'+esc(t.title)+'</span><span class="rail-meta">'+esc(t.day)+" · "+esc(t.lane)+'</span></span></button>';
  }).join("");
  var label=week.maintenance?("Maintenance "+(wi-PLAN.weeks.length+1)):("Week "+(wi+1));
  return '<aside class="card week-rail"><div class="rail-head"><h3>'+label+'</h3><span>'+done+'/'+week.sessions.length+' done</span></div><div class="rail-list">'+items+'</div><p class="rail-rule"><strong>No catch-up:</strong> unfinished sessions archive when the next week starts. Use their miss only to choose a repair.</p></aside>';
}
function bindRail(root){
  root.querySelectorAll("[data-task]").forEach(function(b){
    b.addEventListener("click",function(){selectTask(b.getAttribute("data-task"));});
  });
}
function renderRoadmap(){
  var root=document.getElementById("view-roadmap");
  var elapsed=elapsedWeekIndex();
  var roadCurrent=elapsed<PLAN.weeks.length?elapsed:-1;
  var total=allTasks().length;
  var complete=allTasks().filter(function(r){return !!S.completed[r.task.id];}).length;
  var hours=Math.round(allTasks().reduce(function(sum,r){return sum+r.task.minutes;},0)/60);
  var gatesPassed=PLAN.gates.filter(function(g){return S.gateResults[g.id]==="pass";}).length;
  var html=pageHead("Plan","12-week core","")+
    '<div class="section-grid"><div class="card mini-card"><b>'+complete+'/'+total+'</b><span>sessions completed</span></div><div class="card mini-card"><b>≈'+hours+'h</b><span>total calendar reserve</span></div><div class="card mini-card"><b>'+gatesPassed+'/'+PLAN.gates.length+'</b><span>readiness gates passed</span></div></div>';
  PLAN.weeks.forEach(function(w,wi){
    var count=weekDoneCount(w);
    var label=wi===roadCurrent?"Current":(count===w.sessions.length?"Complete":(wi<elapsed?"Archived":count+"/"+w.sessions.length));
    html+='<details class="card week-card" '+(wi===roadCurrent?"open":"")+'><summary><span><span class="week-summary-title">Week '+(wi+1)+' · '+esc(w.theme||w.title)+'</span><span class="week-summary-sub">'+esc(weekDates(wi))+'</span></span><span class="week-badge">'+esc(label)+'</span></summary><div class="week-body">';
    w.sessions.forEach(function(t){
      var status=taskStatus(t,wi);
      html+='<div class="road-task"><span class="road-day">'+esc(t.day.slice(0,3))+'</span><span><span class="road-title">'+esc(t.title)+'</span><span class="road-meta">'+esc(t.lane)+' · '+t.minutes+' min</span></span><button class="btn small" type="button" data-task="'+esc(t.id)+'">'+(S.completed[t.id]?"Review":"Open")+'</button></div>';
    });
    html+='</div></details>';
  });
  var maintenanceNumber=Math.max(1,elapsed-PLAN.weeks.length+1);
  html+='<details class="card week-card" '+(elapsed>=PLAN.weeks.length?"open":"")+'><summary><span><span class="week-summary-title">After Week 12 · Maintenance</span><span class="week-summary-sub">Five blocks repeat weekly.</span></span><span class="week-badge">'+(elapsed>=PLAN.weeks.length?("Current · "+maintenanceNumber):"Repeats weekly")+'</span></summary><div class="week-body">'+PLAN.maintenance.map(function(t){return '<div class="road-task"><span class="road-day">'+esc(t.day.slice(0,3))+'</span><span><span class="road-title">'+esc(t.title)+'</span><span class="road-meta">'+esc(t.lane)+' · '+t.minutes+' min</span></span></div>';}).join("")+'</div></details>';
  root.innerHTML=html;
  bindRail(root);
}
function drillById(id){
  return PLAN.drills.find(function(d){return d.id===id;});
}
function rubricHtml(rubric){
  if(!rubric||!rubric.length)return "";
  return '<ul class="rubric-list">'+rubric.map(function(row){
    return '<li><strong>'+esc(row.dimension)+':</strong> 0 — '+esc(row.score_0)+' 1 — '+esc(row.score_1)+' 2 — '+esc(row.score_2)+'</li>';
  }).join("")+'</ul>';
}
function openDrill(id){
  S.activeDrill=id;
  save();
  show("practice");
}
function renderPractice(){
  var root=document.getElementById("view-practice");
  if(S.activeDrill&&drillById(S.activeDrill)){renderDrillRun(root,drillById(S.activeDrill));return;}
  var cats=["All"].concat(Array.from(new Set(PLAN.drills.map(function(d){return d.category;}))));
  var drills=PLAN.drills.filter(function(d){return activeCategory==="All"||d.category===activeCategory;});
  var html=pageHead("Practice","Source-backed practice","")+
    '<div class="toolbar">'+cats.map(function(c){return '<button class="filter-btn '+(c===activeCategory?"on":"")+'" type="button" data-category="'+esc(c)+'">'+esc(c)+'</button>';}).join("")+'<span class="spacer"></span><button class="btn warm" type="button" id="pick-drill">Pick for me</button></div>'+
    '<div class="drill-grid">'+drills.map(function(d){
      var result=S.drillResults[d.id]||"";
      return '<article class="card drill-card"><span class="tag '+(result==="solid"?"accent":result==="repair"?"orange":"")+'">'+esc(result==="solid"?"Solid":result==="repair"?"Needs repair":d.category)+'</span><h3>'+esc(d.title)+'</h3><p>'+d.minutes+' minutes</p><button class="btn small" type="button" data-open-drill="'+esc(d.id)+'">Open practice</button></article>';
    }).join("")+'</div>';
  root.innerHTML=html;
  root.querySelectorAll("[data-category]").forEach(function(b){b.onclick=function(){activeCategory=b.getAttribute("data-category");renderPractice();};});
  root.querySelectorAll("[data-open-drill]").forEach(function(b){b.onclick=function(){openDrill(b.getAttribute("data-open-drill"));};});
  document.getElementById("pick-drill").onclick=function(){
    var pool=drills.length?drills:PLAN.drills;

function interviewPhaseIndex(){
  if(!S.interview.date)return 0;
  var diff=dayDiff(parseDate(S.interview.date),parseDate(todayKey()));
  if(diff>14)return 0;
  if(diff>=4)return 1;
  if(diff>=2)return 2;
  if(diff===1)return 3;
  if(diff===0)return 4;
  return 5;
}
function interviewDaysRemaining(){
  return S.interview.date?dayDiff(parseDate(S.interview.date),parseDate(todayKey())):null;
}
function currentSprint(){
  var diff=interviewDaysRemaining();
  if(diff==null||diff<=0||diff>14)return null;
  var kind=S.interview.sprint;
  if(!kind&&diff<=3)return {key:"final",label:"Final 72 hours",dayLabel:"Now",actions:PLAN.interviewSprints.final_72_hours,index:0};
  if(!kind){
    kind=diff<=7?"seven":"fourteen";
    S.interview.sprint=kind;
    save();
  }
  var items=kind==="seven"?PLAN.interviewSprints.seven_day:PLAN.interviewSprints.fourteen_day;
  var total=kind==="seven"?7:14;
  var index=Math.max(0,Math.min(items.length-1,total-diff));
  return {key:kind,label:kind==="seven"?"7-day sprint":"14-day sprint",dayLabel:"Day "+(index+1),day:items[index],index:index};
}

  var completed=Object.keys(S.completed).filter(function(k){return S.completed[k];}).length;
  var sourceRows=PLAN.sources.map(function(src){
    var name=src.url?'<a href="'+esc(src.url)+'" target="_blank" rel="noopener">'+esc(src.name)+' ↗</a>':esc(src.name);
    return '<div class="source-row"><b>'+name+'</b><span>'+esc(src.type)+'</span><small>'+esc(src.usedFor)+'</small></div>';
  }).join("");
  root.innerHTML=pageHead("Settings","Plan and data","")+
    '<div class="setup-grid"><section class="card form-card"><h2>Plan settings</h2><div class="field"><label for="start-date">Week 1 starts</label><input id="start-date" type="date" value="'+esc(S.startDate)+'"><p class="help">A new week archives unfinished work; it does not create a backlog.</p></div>'+
    '<div class="field"><label for="target-date">Target date</label><input id="target-date" type="date" value="'+esc(S.targetDate)+'"></div>'+
    '<div class="field"><label for="role">Primary label</label><select id="role"><option value="both">RS + RE</option><option value="rs">Research Scientist</option><option value="re">Research Engineer</option></select><p class="help">This changes emphasis labels, not the common core. Both is recommended for your background.</p></div></section>'+
    '<section class="card form-card"><h2>Progress data</h2><p>'+completed+' sessions are complete. Progress stays in this browser unless you download a backup.</p><div class="task-footer"><button class="btn" id="export-data" type="button">Download backup</button><button class="btn" id="import-data" type="button">Import backup</button><span class="spacer"></span><button class="btn danger" id="reset-data" type="button">Reset progress</button></div><p class="help" style="margin-top:14px">The earlier interview-prep version remains under its old storage key and is not overwritten.</p></section></div>'+
    '<div class="setup-grid"><details class="card compact-details"><summary>Plan rules</summary><div class="compact-body"><ol class="rules-list">'+PLAN.rules.map(function(r){return '<li>'+esc(r)+'</li>';}).join("")+'</ol></div></details>'+
    '<details class="card compact-details"><summary>Sources and design notes</summary><div class="compact-body"><p>Today uses a short critical path, limited distraction, written instructions, and timed focus blocks. This is an interface choice, not medical advice.</p><div class="source-list">'+sourceRows+'</div></div></details></div>';
  document.getElementById("role").value=S.role;
  document.getElementById("start-date").onchange=function(e){if(e.target.value){S.startDate=e.target.value;S.selectedTask="";save();renderHeader();renderSetup();}};
  document.getElementById("target-date").onchange=function(e){if(e.target.value){S.targetDate=e.target.value;save();}};
  document.getElementById("role").onchange=function(e){S.role=e.target.value;save();renderHeader();};
  document.getElementById("export-data").onclick=exportData;
  document.getElementById("import-data").onclick=function(){document.getElementById("import-file").click();};
  document.getElementById("reset-data").onclick=function(){
    if(!confirm("Reset all progress, notes, scores, timers, and interview details in this version? Download a backup first if needed."))return;
    S=freshState();save();renderSetup();renderHeader();announce("Progress reset.");
  };
}
function exportData(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="research-interview-lab-backup.json";a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},500);
}
function importData(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var value=JSON.parse(reader.result);
      if(value.version!==5)throw new Error("Wrong version");
      S=Object.assign(freshState(),value);
      S.interview=Object.assign(freshState().interview,value.interview||{});
      S.timer=Object.assign(freshState().timer,value.timer||{});
      save();renderView(activeView);announce("Backup imported.");
    }catch(err){alert("That file is not a Research Interview Lab v5 backup.");}
  };
  reader.readAsText(file);
}
function boot(){
  fetch("plan.json",{cache:"no-store"}).then(function(r){
    if(!r.ok)throw new Error("Plan failed to load");
    return r.json();
  }).then(function(plan){
    PLAN=plan;
    S=loadState();
    buildNav();
    document.getElementById("import-file").addEventListener("change",function(e){importData(e.target.files[0]);e.target.value="";});
    var hash=(location.hash||"#today").slice(1);
    if(hash.indexOf("practice:")===0){S.activeDrill=hash.split(":")[1]||"";hash="practice";}
    if(!TABS.some(function(t){return t[0]===hash;}))hash="today";
    show(hash);
    startTicker();
  }).catch(function(){
    document.getElementById("view-today").innerHTML='<div class="notice"><strong>The curriculum could not load.</strong> Serve this folder over HTTP and keep plan.json beside index.html.</div>';
  });
}
window.addEventListener("beforeunload",function(){if(S&&S.timer.running)pauseTimer();});
boot();
})();
</script>
</body>
</html>
