<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision Research Scientist Interview Prep</title>
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --panel2:#fafafa; --line:#e6e6e6;
    --ink:#1a1a1a; --mut:#6b7280; --accent:#cc0000; --accent2:#cc0000;
    --good:#1a7f37; --warn:#b45309; --bad:#cc0000; --chip:#f2f2f2;
    --r:8px; --sh:none;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{padding:18px 26px 0;border-bottom:1px solid var(--line);position:sticky;top:0;
    background:rgba(255,255,255,.94);backdrop-filter:blur(6px);z-index:20}
  .htop{display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
  h1 small{display:block;font-size:12.5px;color:var(--mut);font-weight:400;margin-top:3px}
  .meta{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
  .stat{text-align:center;min-width:64px}
  .stat b{display:block;font-size:18px;line-height:1.1;font-weight:700}
  .stat span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
  .overall{flex:1;min-width:200px}
  .bar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
  nav{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:thin}
  nav button{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--mut);
    padding:9px 12px;cursor:pointer;font-size:13px;font-weight:600;margin-bottom:-1px;white-space:nowrap}
  nav button:hover{color:var(--ink)}
  nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
  main{padding:24px 26px 80px;max-width:1080px;margin:0 auto}
  .view{display:none}
  .view.on{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
  .table-card{overflow-x:auto}
  .card h3{margin:0 0 4px;font-size:15px;font-weight:700}
  .grid{display:grid;gap:14px}
  @media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:var(--chip);color:var(--mut);font-weight:600}
  .pill.p1,.pill.p2,.pill.p3,.pill.p4{background:var(--chip);color:var(--mut)}
  .ck{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
  .ck input{margin-top:3px;width:16px;height:16px;accent-color:var(--good);flex:none;cursor:pointer}
  .taskcopy{font-size:13.5px;min-width:0;flex:1}
  .tasktext{display:block;cursor:pointer;font-size:14px;line-height:1.62;color:#252525}
  .task-prose{max-width:74ch}
  .task-steps{display:grid;gap:8px;margin:2px 0 0}
  .task-step{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:start}
  .step-label{font-size:10.5px;line-height:1.4;text-transform:uppercase;letter-spacing:.055em;font-weight:750;color:var(--accent);padding-top:3px}
  .step-copy{min-width:0}
  .completion{max-width:74ch;margin-top:9px;padding:8px 10px;border-radius:6px;background:#f3f8f4;color:#285a35;font-size:12px}
  .completion strong{font-weight:750}
  .ck.done .tasktext{color:var(--mut);text-decoration:line-through}
  .ck.done .completion{opacity:.65}
  .ck.skipped{opacity:.64}
  .ck.skipped .tasktext{text-decoration:line-through}
  .res .ck.done span,#v-story .ck.done span{color:var(--mut);text-decoration:line-through}
  .taskmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px;color:var(--mut);font-size:11.5px}
  .taskmeta .donewhen{color:#374151}
  .timepill{font-size:10.5px;padding:2px 8px;border-radius:99px;background:#eef3f8;color:#334155;font-weight:650}
  .timepill.strict{background:#fbe9e9;color:var(--accent)}
  .timepill.deep{background:#f4eee5;color:var(--warn)}
  .focusbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:7px;padding:7px 9px;background:var(--panel2);border:1px solid var(--line);border-radius:6px}
  .focusclock{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:700;min-width:52px;color:var(--ink)}
  .focusclock.active{color:var(--accent)}
  .focushelp{font-size:11px;color:var(--mut);flex:1 1 180px}
  .taskfallback{margin-top:5px}
  .taskfallback summary{font-size:11.5px;color:var(--accent);font-weight:600}
  .taskfallback div{margin-top:4px;color:var(--mut);font-size:12px;border-left:2px solid var(--line);padding-left:8px}
  .taskstarter{margin-top:9px;padding:7px 9px;border:1px solid #eadfce;border-radius:6px;background:#fffaf2}
  .taskstarter summary{color:#8a4b08;font-size:12px}
  .taskmore{margin-top:8px}
  .taskmore>.taskmorebody{border-left:0;padding:8px 0 0;margin:0;color:var(--mut)}
  .taskmorebody .taskmeta{margin-top:8px}
  .dashboard-overview{padding:0;overflow:hidden}
  .dashboard-overview>summary{padding:13px 16px;color:var(--ink)}
  .dashboard-overview-body{padding:0 16px 14px}
  .more-grid{display:grid;gap:10px}
  @media(min-width:700px){.more-grid{grid-template-columns:1fr 1fr}}
  .more-link{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:13px 14px;cursor:pointer;color:var(--ink);font:inherit}
  .more-link:hover{border-color:#aaa;background:#fff}
  .more-link b{display:block;font-size:14px;margin-bottom:2px}
  .more-link span{display:block;font-size:12px;color:var(--mut)}
  .coding-summary{display:grid;gap:10px;margin:14px 0}
  @media(min-width:700px){.coding-summary{grid-template-columns:repeat(3,1fr)}}
  .coding-stat{border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:10px 12px}
  .coding-stat b{display:block;font-size:18px;color:var(--ink)}
  .coding-stat span{font-size:11.5px;color:var(--mut)}
  .coding-week{padding:0;overflow:hidden}
  .coding-week>summary{padding:12px 15px;color:var(--ink)}
  .coding-week-body{padding:0 15px 12px;border-top:1px solid var(--line)}
  .problem-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .problem-row:last-child{border-bottom:0}
  .problem-row>input{width:17px;height:17px;accent-color:var(--good)}
  .problem-row.done .problem-title{text-decoration:line-through;color:var(--mut)}
  .problem-title{display:block;font-weight:650;font-size:13.5px}
  .problem-meta{font-size:11.5px;color:var(--mut);margin-top:2px}
  .problem-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .coding-source{font-size:11.5px;color:var(--mut);margin-top:10px}
  .flex-task{background:var(--panel2);border-radius:6px;padding:8px 10px;margin:3px 0}
  .kind{font-size:9.5px;padding:1px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .kind.core{background:#e8f5ec;color:var(--good)}
  .kind.flex{background:#f4eee5;color:var(--warn)}
  .kind.company{background:#fbe9e9;color:var(--accent)}
  .wkhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .wkhead .pr{font-size:12px;color:var(--mut)}
  .mini{height:4px;background:var(--chip);border-radius:99px;overflow:hidden;margin:8px 0 4px}
  .mini>i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
  .now{border-color:var(--accent)}
  .sess{border-top:1px solid var(--line);padding:10px 0 4px;margin:0}
  .sess:first-of-type{border-top:none}
  .sesshead{display:flex;align-items:center;gap:9px;margin-bottom:3px;flex-wrap:wrap}
  .sday{font-size:11px;font-weight:700;color:var(--mut);background:var(--chip);border-radius:5px;padding:2px 8px;flex:none;min-width:40px;text-align:center}
  .sess.sdone .sday{color:#fff;background:var(--good)}
  .stitle{font-weight:600;font-size:13.5px;flex:1 1 auto;min-width:0}
  .sct{font-size:11.5px;color:var(--mut);flex:none;margin-left:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  td input,td select,td textarea{width:100%;background:#fff;border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit}
  td textarea{resize:vertical;min-height:30px}
  .btn{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 13px;
    cursor:pointer;font-size:13px;font-weight:600}
  .btn:hover{border-color:var(--ink)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.accent:hover{opacity:.9;border-color:var(--accent)}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .x{color:var(--mut);cursor:pointer;font-weight:700;background:none;border:none;font-size:15px}
  .x:hover{color:var(--bad)}
  .tag{font-size:10.5px;padding:2px 9px;border-radius:99px;background:var(--chip);color:var(--mut);margin-right:6px;display:inline-block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .res a{font-weight:600}
  .res small{color:var(--mut)}
  .res li{margin-bottom:11px;list-style:none}
  .res ul{padding-left:0;margin:0}
  .star{color:var(--accent)}
  .secthead{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px;flex-wrap:wrap;gap:8px}
  .muted{color:var(--mut)}
  code{overflow-wrap:anywhere;word-break:break-word}
  .sectionhdr{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);
    margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .sectionhdr:first-child{margin-top:4px}
  .kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
  .kpi .card{min-width:0;margin:0;text-align:left;padding:14px 16px}
  .kpi b{font-size:22px;display:block;font-weight:700}
  .kpi .card span{font-size:11.5px;color:var(--mut)}
  .note{font-size:12.5px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);padding:9px 12px;border-radius:0 6px 6px 0;margin:8px 0}
  .empty{padding:34px 20px;text-align:center;color:var(--mut)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar .sp{flex:1}
  .savedtag{font-size:12px;color:var(--good);opacity:0;transition:opacity .3s}
  .savedtag.show{opacity:1}
  details summary{cursor:pointer;font-weight:600;color:var(--mut);font-size:13px}
  .storagebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:0 0 12px;font-size:12px;color:var(--mut)}
  .storagebar .sp{flex:1}
  .storagebar b{color:var(--ink)}
  .storagebar .sm{font-size:11.5px}
  .dot{width:7px;height:7px;border-radius:99px;background:var(--mut);flex:none}
  .dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
  .tlink{color:var(--accent);font-weight:600;text-decoration:none}
  .tlink:hover{text-decoration:underline}
  .setlbl{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
  .setrow{display:flex;gap:14px;flex-wrap:wrap}
  .setrow>div{flex:1 1 160px}
  .setdays{display:grid;gap:10px;grid-template-columns:1fr}
  @media(min-width:620px){.setdays{grid-template-columns:1fr 1fr}}
  #v-settings input,#v-settings select{width:100%;background:#fff;border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:9px 10px;font-size:13.5px;font-family:inherit}
  .authbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:0 0 12px;margin-top:-4px}
  .authbar.on{display:flex}
  .authbar input{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:6px;
    padding:7px 9px;font-size:13px;font-family:inherit;width:170px}
  .authbar .btn{padding:7px 11px}
  .gbtn{display:flex;align-items:center;gap:7px;background:#fff;color:#1a1a1a;
    border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}
  .gbtn:hover{background:#f7f7f7}
  .gbtn svg{width:15px;height:15px}
  #autherr{color:var(--bad);font-size:12px;flex-basis:100%}
  #autherr:empty{display:none}
  #cfgnote{display:none;font-size:12px;color:var(--warn)}
  .linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:12px;padding:0;cursor:pointer}
  .linkbtn:hover{text-decoration:underline}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .page-foot{color:var(--mut);font-size:12px;text-align:center;margin-top:28px}
  .gategrid{display:grid;gap:12px}
  @media(min-width:760px){.gategrid{grid-template-columns:1fr 1fr}}
  .gatecard{margin:0}
  .gatehead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .gatehead h3{margin:0}
  .gatestate{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--chip);color:var(--mut)}
  .gatestate.pass{background:#e8f5ec;color:var(--good)}
  .gatestate.fail{background:#fbe9e9;color:var(--bad)}
  .gatestate.defer{background:#f4eee5;color:var(--warn)}
  .gateform{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-top:10px}
  .gateform label{font-size:11px;color:var(--mut);font-weight:600}
  .gateform select,.gateform input,.gateform textarea{display:block;width:100%;margin-top:3px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit;font-size:12.5px}
  .gateform textarea{grid-column:1/-1;min-height:58px;resize:vertical}
  .protocol-on{border-color:var(--accent);background:#fff8f8}
  .protocol-step{border-left:3px solid var(--line);padding-left:12px;margin:14px 0}
  .protocol-step h3{margin-bottom:2px}
  .protocol-step ul,.rulelist{margin:7px 0 0;padding-left:20px}
  .protocol-step li,.rulelist li{margin:5px 0}
  .idtag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--mut)}
  .tasknote textarea{width:100%;min-height:56px;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit;font-size:12px;resize:vertical}
  .cardprompt{font-weight:650;font-size:14px}
  .cardanswer{white-space:pre-wrap;margin:8px 0;color:#374151}
  .due{border-color:var(--warn)}
  #v-cards textarea,#v-cards input[type=date]{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 9px;font:inherit;font-size:13px}
  .target-universe{padding:18px;margin-top:14px}
  .target-universe>p{margin:4px 0 14px}
  .target-group{border-top:1px solid var(--line);padding:12px 0 2px}
  .target-group:first-of-type{border-top:0;padding-top:0}
  .target-group>summary{color:var(--ink);font-size:14px}
  .target-rule{margin:5px 0 11px;font-size:12px;color:var(--mut)}
  .target-grid{display:grid;gap:10px}
  @media(min-width:760px){.target-grid{grid-template-columns:1fr 1fr}}
  .target-card{border:1px solid var(--line);border-radius:7px;padding:13px;background:var(--panel2);margin:0}
  .target-card h4{font-size:14px;margin:0}
  .target-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .target-meta{font-size:11.5px;color:var(--mut);margin:3px 0 8px}
  .target-roles{font-size:12px;margin:8px 0;color:#374151}
  .target-why{font-size:12.5px;margin:0}
  .target-pack{font-size:11.5px;color:var(--mut);margin-top:8px}
  .target-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
  .target-actions .btn:disabled{cursor:default;opacity:.62}
  .plan-intro{padding:20px 21px;margin-bottom:14px;border-left:4px solid var(--accent)}
  .plan-intro h2{font-size:20px;line-height:1.25;margin:0 0 6px;letter-spacing:-.015em}
  .plan-intro p{max-width:72ch;margin:0;color:var(--mut)}
  .reading-cues{display:grid;gap:8px;margin-top:14px}
  @media(min-width:760px){.reading-cues{grid-template-columns:repeat(3,1fr)}}
  .reading-cue{padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);font-size:12px;color:var(--mut)}
  .reading-cue b{display:block;color:var(--ink);margin-bottom:1px}
  .plan-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 16px}
  .plan-tools .sp{flex:1}
  .week-card{padding:0;overflow:hidden}
  .week-card[open]{border-color:#d7d7d7}
  .week-card.now{border-color:var(--accent)}
  .week-summary{list-style:none;padding:15px 18px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;color:var(--ink)}
  .week-summary::-webkit-details-marker{display:none}
  .week-summary::before{content:'›';grid-column:2;grid-row:1/3;font-size:22px;color:var(--mut);transform:rotate(0);transition:transform .15s}
  .week-card[open]>.week-summary::before{transform:rotate(90deg)}
  .week-title{font-size:15px;font-weight:720;line-height:1.35;padding-right:8px}
  .week-sub{font-size:11.5px;color:var(--mut);margin-top:3px;padding-right:8px}
  .week-body{padding:0 18px 14px;border-top:1px solid var(--line)}
  .timing-guide{padding:0;overflow:hidden}
  .timing-guide>summary{padding:13px 16px;color:var(--ink)}
  .timing-guide-body{padding:0 16px 14px}
  @media(max-width:700px){
    header{padding:14px 16px 0}
    main{padding:18px 14px 64px}
    .meta{width:100%}.overall{width:100%}
    .kpi{grid-template-columns:1fr}
    nav{margin-left:-16px;margin-right:-16px;padding:0 8px}
    nav button{padding:9px 10px}
    .storagebar .muted{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .storagebar .sp{display:none}
    .authbar input{width:100%}
    th,td{min-width:105px}
    .task-step{grid-template-columns:1fr;gap:1px}
    .step-label{padding-top:0}
    .week-summary{padding:13px 14px}.week-body{padding:0 14px 12px}
    .problem-row{grid-template-columns:auto minmax(0,1fr)}
    .problem-actions{grid-column:2;justify-content:flex-start}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
  }
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1>Interview Prep<small id="sub">Research Scientist · Generative Vision / Multimodal / RL</small></h1>
    <div class="meta">
      <div class="overall">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;gap:14px">
          <span class="muted" id="kWeekLabel">—</span><span id="kPct" class="muted">0%</span>
        </div>
        <div class="bar"><i id="kBar"></i></div>
      </div>
    </div>
  </div>
  <nav id="nav" aria-label="Interview preparation sections"></nav>
  <div id="storagebar" class="storagebar"></div>
  <div id="authbar" class="authbar">
    <button class="gbtn" id="g-signin" type="button">

<script>
/* ---------- dates (user-configurable via Settings) ---------- */
const DEF_START='2026-08-03', DEF_TARGET='2027-05-31';
function getStart(){const v=(typeof S!=='undefined'&&S.settings&&S.settings.startDate)||DEF_START;return new Date(v+'T00:00:00');}
function getTarget(){const v=(typeof S!=='undefined'&&S.settings&&S.settings.targetDate)||DEF_TARGET;return new Date(v+'T00:00:00');}
function fmtD(d){return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function dateKey(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function weekDateLabel(i,w){const a=new Date(getStart());a.setDate(a.getDate()+i*7);
  if(w&&(w.openEnded||w.id==='live'))return 'From '+fmtD(a)+' onward';
  const b=new Date(a);b.setDate(b.getDate()+6);return fmtD(a)+' – '+fmtD(b);}

/* ---------- plan content (loaded from plan.json; personalized at render time) ---------- */
let WEEKS=[], PHASES={}, TOPICS=[], STORY_CATS=[], RESOURCES=[], PACING={};
let GATES=[], EVIDENCE={}, TIMING={}, PROTOCOL={}, RUBRIC={}, TARGET_COMPANIES={groups:[]}, ADAPT_RULES=[], FAILURE_CATEGORIES=[], FIRST_CUTS=[], NEVER_CUT=[];
let PERSONALIZATION={vars:{},branches:{}};
let RAW_PLAN=null;
let activeUid=null, activeEmail='', activeKey=null;
let planError='';
const PLAN_REFINEMENT_VERSION=12;
const PLAN_CONTENT_REFINEMENT_VERSION=12;
const TARGET_COMPANY_FIELDS=[
  ['targetCompanyA','Target company 1','e.g. OpenAI'],
  ['targetCompanyB','Target company 2','e.g. Anthropic'],
  ['targetCompanyC','Target company 3','e.g. Google DeepMind']
];

function userVars(){
  const vars={};
  const cfg=(typeof S!=='undefined'&&S&&S.userConfig)||{};
  const defs=PERSONALIZATION.vars||{};
  TARGET_COMPANY_FIELDS.forEach(([k,label])=>{
    const v=(cfg[k]||'').toString().trim();
    vars[k]=v||label.toLowerCase();
  });
  Object.keys(defs).forEach(k=>{
    const v=(cfg[k]||'').toString().trim();
    vars[k]=v||(defs[k]&&defs[k].default)||k;
  });
  return vars;
}
function userBranchChoice(branchId){
  const cfg=(typeof S!=='undefined'&&S&&S.userConfig)||{};
  const defs=PERSONALIZATION.branches||{};
  const def=defs[branchId];
  const choice=(cfg.branches&&cfg.branches[branchId])||(def&&def.default);
  return choice;
}
function substituteVars(text,vars){
  if(typeof text!=='string')return text;
  return text.replace(/\{\{(\w+)\}\}/g,(m,k)=>vars[k]!=null?vars[k]:m);
}
function taskText(t){
  return typeof t==='string'?t:(t&&t.text)||'';
}
function taskPriority(t){
  const p=typeof t==='object'&&t&&t.priority;
  return p==='flex'||p==='company'?p:'core';
}
function isCoreTask(t){return taskPriority(t)==='core';}
function normalizePlanContent(raw){
  const plan=JSON.parse(JSON.stringify(raw||{}));
  const weeks=Array.isArray(plan.weeks)?plan.weeks:[];
  (plan.recurringTasks||[]).forEach(r=>{
    const start=weeks.findIndex(w=>w.id===r.fromWeek);
    const end=weeks.findIndex(w=>w.id===r.throughWeek);
    if(start<0||end<start)return;
    for(let wi=start;wi<=end;wi++){
      const w=weeks[wi];
      if((r.excludeWeeks||[]).includes(w.id))continue;
      const suffix=r.taskIdSuffix||'OUT';
      const id=w.id.toUpperCase()+'-'+suffix;
      if((w.sessions||[]).some(s=>(s.x||[]).some(t=>t&&t.id===id)))continue;
      const task=Object.assign({},r,{id});
      delete task.fromWeek;delete task.throughWeek;delete task.excludeWeeks;delete task.taskIdSuffix;delete task.sessionTitle;
      w.sessions=w.sessions||[];
      w.sessions.push({t:r.sessionTitle,x:[task],_preserveDay:true});
    }
  });
  const coding=plan.codingProgram||{};
  const ordered=(coding.weekOrder||[]).flatMap(weekId=>(coding.schedule&&coding.schedule[weekId]||[]).map(q=>({weekId,q})));
  ordered.forEach(({weekId,q},index)=>{
    const w=weeks.find(x=>x.id===weekId);if(!w)return;
    const taskId=q.taskId||q.id;
    if((w.sessions||[]).some(s=>(s.x||[]).some(t=>t&&t.id===taskId)))return;
    const reserve=Math.ceil((Number(q.attemptMinutes)||20)*1.96/5)*5;
    const prior=index?ordered[index-1].q:null;
    const prereq=q.prereq||(prior?(prior.taskId||prior.id):'');
    const task={
      id:taskId,priority:'core',codingProblem:true,codingProblemId:q.id,
      difficulty:q.difficulty,topic:q.topic,attemptMinutes:q.attemptMinutes,
      workWindow:`${q.attemptMinutes}m attempt + ${Math.max(15,reserve-q.attemptMinutes)}m review and log`,
      calendarReserve:`${reserve}m`,gate:q.gate||undefined,
      text:`<strong>Attempt:</strong> open <a href="${q.url}" target="_blank" rel="noopener" class="tlink">${q.title}</a>, turn AI assistance off, and set a ${q.attemptMinutes}-minute countdown. Explain the approach and target complexity before coding. <strong>Review:</strong> test edge cases, then inspect one explanation only after the countdown. Close it and restate the approach from memory. <strong>Log:</strong> save the pattern, elapsed attempt time, outcome, complexity, and first broken step.`,
      competency:'general coding',scenario:'Coding screen',
      why:q.gate?'This is the second problem in the first two-Medium checkpoint, scheduled after 19 mixed-topic preparations.':`This problem keeps ${String(q.topic||'coding').replaceAll('-',' ')} in a mixed sequence instead of isolating one topic for several weeks.`,
      doneWhen:`${q.title} is logged with the pattern, elapsed attempt time, outcome, complexity, and first broken step.${q.gate?' The G1 result is also recorded.':''}`,
      fallback:'Read the prompt, write a three-sentence approach and target complexity, log why implementation did not start, and stop.',
      prereq
    };
    const problems=(coding.schedule&&coding.schedule[weekId])||[];
    const slot=problems.findIndex(x=>x.id===q.id);
    const days=weekId==='w0'?(problems.length===2?['Sun AM','Sun PM']:['Sat AM','Sun AM','Sun PM']):problems.length===2?['Wed','Sun']:['Tue','Thu','Sun'];
    w.sessions=w.sessions||[];
    const day=days[slot]||'Any day';
    const session={t:`${day} · ${reserve}m — Grind 75 #${q.id.replace('G75-','')}: ${q.title}`,x:[task],_preserveDay:true};
    const prefix=day.slice(0,3);let insertAt=-1;
    w.sessions.forEach((s,i)=>{if(String(s.t||'').slice(0,3)===prefix)insertAt=i+1;});
    if(insertAt<0)w.sessions.push(session);else w.sessions.splice(insertAt,0,session);
  });
  weeks.forEach(w=>{
    (w.sessions||[]).forEach((s,si)=>{
      s.x=(Array.isArray(s.x)?s.x:[]).map((t,ti)=>{
        const legacyKey=w.id+'s'+si+'#'+ti;
        if(typeof t==='string')return {text:t,_key:legacyKey,_legacyKey:legacyKey};
        return Object.assign({},t||{},{_key:(t&&t.id)||legacyKey,_legacyKey:legacyKey});
      });
    });
  });
  plan.clientRefinementVersion=PLAN_CONTENT_REFINEMENT_VERSION;
  return plan;
}
function applyTrackFilter(weeks){
  return (weeks||[]).filter(w=>{
    if(!w.track)return true;
    const branchId=w.trackOf||'w9';
    return userBranchChoice(branchId)===w.track;
  });
}
function migratePlanProgress(){
  if(typeof S==='undefined'||!S||S.planRefinementVersion>=PLAN_REFINEMENT_VERSION)return false;
  if(!S.weekTasks||typeof S.weekTasks!=='object')S.weekTasks={};
  if((S.planRefinementVersion||0)<3) S.weekTasks={};
  if((S.planRefinementVersion||0)<4){
    Object.keys(S.weekTasks).forEach(k=>{if(/^(w4|w6|w7|w8|w9)/.test(k))delete S.weekTasks[k];});
  }
  // v5 re-sequences every week (adds W0 and the Live Phase), so positional task keys no longer
  // point at the same work. Keeping them would mark unrelated tasks done.
  if((S.planRefinementVersion||0)<5) S.weekTasks={};
  // v6 switches from positional keys to the stable IDs introduced by the audit.
  // Preserve any progress recorded against the first v5 renderer.
  if((S.planRefinementVersion||0)<6){
    WEEKS.forEach(w=>(w.sessions||[]).forEach(s=>(s.x||[]).forEach(t=>{
      if(t.id&&t._legacyKey&&S.weekTasks[t._legacyKey])S.weekTasks[t.id]=true;
    })));
  }
  // v7 fixes the prerequisite order. These six tasks changed meaning, and old gate
  // results must not survive the move from a cold Week 0 test to taught Week 1/2 gates.
  if((S.planRefinementVersion||0)<7){
    ['W0-G1','W0-G2','W0-G8','W1-T8','W2-T2','W2-T8'].forEach(id=>delete S.weekTasks[id]);
    if(S.gates) ['G1','G2','G8'].forEach(id=>delete S.gates[id]);
  }
  if((S.planRefinementVersion||0)<8){
    const changed=['W1-T4','W3-T1','W3-T3','W3-T4','W4-T2','W4-T3','W4-T4',
      'W5-T2','W5-T3','W5-T4','W5-T7','W6-T2','W6-T3','W6-T7','W6-T8',
      'W7-T1','W7-T2','W7-T3','W7-T4','W7-T8','W8-T3','W9-T2','W9-T3',
      'W9-T4','W9-T7','W9-T8','W10-T4','W11-T4','W11-T7','W13-T2','W13-T3',
      'W13-T4','W13-T7','W14-T1','W14-T3','W15-T3','W15-T6','W15-T7'];
    changed.forEach(id=>delete S.weekTasks[id]);
  }
  // v9 adds the evidence-backed coding sequence and changes the modern vision,
  // visual post-training and data/evaluation assignments.
  if((S.planRefinementVersion||0)<9){
    ['W0-G1','W2-T8','W3-T2','W3-T6','W6-T3','W9-T2','W9-T4','W9-T8','W10-T3','W10-T7','W14-T6']
      .forEach(id=>delete S.weekTasks[id]);
    if(S.gates) ['G1','G7'].forEach(id=>delete S.gates[id]);
  }
  // v10 changes timing presentation and adds actual-duration calibration without
  // invalidating completed curriculum work.
  if((S.planRefinementVersion||0)<10&&!S.taskTimes)S.taskTimes={};
  // v11 replaces the one-problem maintenance queue with a 34-problem Grind 75
  // sequence and moves G1 until after 19 preparations. Old coding marks no
  // longer refer to the same work.
  if((S.planRefinementVersion||0)<11){
    Object.keys(S.weekTasks).forEach(k=>{if(/-DSA$/.test(k)||['W0-G1','W2-T8','W3-T2'].includes(k))delete S.weekTasks[k];});
    if(S.gates)delete S.gates.G1;
  }
  // v12 replaces the old Two Sum task with a recognition-sheet refresher.
  // Progress, notes and elapsed time for the old task must not mark the new work done.
  if((S.planRefinementVersion||0)<12){
    delete S.weekTasks['W0-G1'];
    if(S.taskNotes)delete S.taskNotes['W0-G1'];
    if(S.taskTimes)delete S.taskTimes['W0-G1'];
    if(S.skippedTasks)delete S.skippedTasks['W0-G1'];
  }
  S.planRefinementVersion=PLAN_REFINEMENT_VERSION;
  return true;
}
function rebuildWeeks(){
  if(!RAW_PLAN)return;
  const allWeeks=Array.isArray(RAW_PLAN.weeks)?RAW_PLAN.weeks:[];
  allWeeks.forEach(w=>{if(w.track&&!w.trackOf)w.trackOf='w9';});
  WEEKS=JSON.parse(JSON.stringify(applyTrackFilter(allWeeks)));
}
function setPlan(raw){
  if(!raw)return;
  RAW_PLAN=normalizePlanContent(raw);
  PERSONALIZATION=RAW_PLAN.personalization||{vars:{},branches:{}};
  PACING=RAW_PLAN.pacing||{};
  rebuildWeeks();
  PHASES=RAW_PLAN.phases||{};TOPICS=RAW_PLAN.topics||[];
  STORY_CATS=RAW_PLAN.stories||[];RESOURCES=RAW_PLAN.resources||[];
  GATES=RAW_PLAN.gates||[];EVIDENCE=RAW_PLAN.evidenceBase||{};TIMING=RAW_PLAN.timingModel||{};PROTOCOL=RAW_PLAN.protocol||{};RUBRIC=RAW_PLAN.rubric||{};TARGET_COMPANIES=RAW_PLAN.targetCompanies||{groups:[]};
  ADAPT_RULES=RAW_PLAN.adaptationRules||[];FAILURE_CATEGORIES=RAW_PLAN.failureCategories||[];
  FIRST_CUTS=RAW_PLAN.firstFiveCuts||[];NEVER_CUT=RAW_PLAN.neverCut||[];
  planError='';const migrated=migratePlanProgress();
  try{
    if(migrated&&activeKey)localStorage.setItem(activeKey,JSON.stringify(S));
  }catch(e){}
}
window.__applyPlan=function(p){ setPlan(p); if(typeof renderAllViews==='function') renderAllViews(); };
window.__hasPlan=()=>WEEKS.length>0;
window.__planMissing=function(){ planError="The preparation plan could not be loaded. Please refresh or contact the site owner."; if(typeof renderAllViews==='function') renderAllViews(); };

/* ---------- state ---------- */
const KEY='ipcc_v2';
const DEFAULT={
  schemaVersion:5,
  planRefinementVersion:0,
  weekTasks:{},        // "w1#0": true
  topics:{},           // idx: {explain:bool, implement:bool, status:''}
  storyReady:{},       // cat: bool
  storyText:{},        // cat: text
  resReviewed:{},      // "g#i": bool
  leet:[],             // {date,problem,pattern,diff,unaided,min,revisit,notes}
  mocks:[],            // {date,type,who,score,well,fix,follow}
  pipe:[],             // {company,role,priority,stage,recruiter,referral,applied,next,status,notes}
  cards:[],            // {prompt,answer,source,due,last}
  taskNotes:{},
  taskTimes:{},         // stable task key: accumulated focus seconds
  skippedTasks:{},
  openWeeks:{},         // week id: whether its roadmap card is expanded
  gates:{},            // gate id: {status,date,failure,notes}
  protocolActive:false,
  protocolCompany:'',
  settings:{startDate:DEF_START,targetDate:DEF_TARGET,days:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],name:''},
  userConfig:{projectA:'',projectB:'',projectC:'',primaryLane:'',adjacentLane:'',targetLabA:'',targetLabB:'',targetCompanyA:'',targetCompanyB:'',targetCompanyC:'',branches:{}},
};
function freshState(){return JSON.parse(JSON.stringify(DEFAULT))}
function normSettings(o){const d={startDate:DEF_START,targetDate:DEF_TARGET,days:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],name:''};
  const s=Object.assign({},d,o||{}); if(!Array.isArray(s.days)||s.days.length<6)s.days=d.days.slice(); return s;}
function normUserConfig(o){
  const d={projectA:'',projectB:'',projectC:'',primaryLane:'',adjacentLane:'',targetLabA:'',targetLabB:'',targetCompanyA:'',targetCompanyB:'',targetCompanyC:'',branches:{}};
  const u=Object.assign({},d,o||{});
  if(!u.branches||typeof u.branches!=='object')u.branches=Object.assign({},d.branches);
  else u.branches=Object.assign({},d.branches,u.branches);
  return u;
}
let S=freshState();
function normalizeState(raw){
  const prior=raw||{};const m=Object.assign(freshState(),prior);
  m.settings=normSettings(m.settings);
  if((prior.schemaVersion||0)<4&&m.settings.startDate==='2026-06-29'&&m.settings.targetDate==='2026-10-19'){
    m.settings.startDate=DEF_START;m.settings.targetDate=DEF_TARGET;
  }
  if((prior.schemaVersion||0)<5&&m.settings.targetDate==='2027-01-11')m.settings.targetDate=DEF_TARGET;
  if(!m.gates||typeof m.gates!=='object')m.gates={};
  if(!Array.isArray(m.cards))m.cards=[];
  if(!m.taskNotes||typeof m.taskNotes!=='object')m.taskNotes={};
  if(!m.taskTimes||typeof m.taskTimes!=='object')m.taskTimes={};
  if(!m.skippedTasks||typeof m.skippedTasks!=='object')m.skippedTasks={};
  if(!m.openWeeks||typeof m.openWeeks!=='object')m.openWeeks={};
  m.schemaVersion=5;m.userConfig=normUserConfig(m.userConfig);return m;
}
function loadForUser(uid){
  const carry=RAW_PLAN;   // the plan is shared content — keep it across guest ↔ account switches
  activeUid=uid;activeKey=KEY+':'+uid;
  WEEKS=[];PHASES={};TOPICS=[];STORY_CATS=[];RESOURCES=[];planError='';
  try{S=normalizeState(JSON.parse(localStorage.getItem(activeKey)))}catch(e){S=freshState()}
  // Curriculum content is shared and comes from plan.json. Account changes may
  // replace progress, but they must never replace the current curriculum.
  if(carry)setPlan(carry);
  try{localStorage.removeItem('ipcc_plan_v2:'+uid)}catch(e){}
}
let saveTimer;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(activeKey)localStorage.setItem(activeKey,JSON.stringify(S));flashSaved();scheduleFileWrite();scheduleServerSave();if(window.__cloudSave)window.__cloudSave(S);},150)}
function flashSaved(){document.querySelectorAll('.savedtag').forEach(t=>{t.classList.add('show');setTimeout(()=>t.classList.remove('show'),900)})}

/* ---------- cloud mode (Firebase) — local helper disabled in the deployed app ---------- */
const CLOUD = true;
window.__getState=()=>S;
window.__prepareUser=function(uid,email){loadForUser(uid);activeEmail=email||'(signed in)';window.__user=activeEmail;renderAllViews();};
window.__applyRemote=function(data){ if(data&&Object.keys(data).length){ S=normalizeState(data);const migrated=migratePlanProgress();if(activeKey)localStorage.setItem(activeKey,JSON.stringify(S));renderAllViews();if(migrated)save(); } };
window.__onLogin=function(){ window.__hideAuth(); renderStorageBar(); renderAllViews(); };

/* ---------- guest mode: the plan is readable and tickable without an account ---------- */
const GUEST_UID='guest';
function hasProgress(st){
  if(!st)return false;
  if(st.weekTasks&&Object.keys(st.weekTasks).some(k=>st.weekTasks[k]))return true;
  if(st.topics&&Object.keys(st.topics).length)return true;
  if(st.storyReady&&Object.keys(st.storyReady).some(k=>st.storyReady[k]))return true;
  if(st.gates&&Object.values(st.gates).some(g=>g&&g.status))return true;
  if(st.protocolActive)return true;
  if(Array.isArray(st.cards)&&st.cards.length)return true;
  if(st.taskNotes&&Object.keys(st.taskNotes).some(k=>st.taskNotes[k]))return true;
  if(st.skippedTasks&&Object.keys(st.skippedTasks).some(k=>st.skippedTasks[k]))return true;
  return ['leet','mocks','pipe'].some(k=>Array.isArray(st[k])&&st[k].length);
}
// Read the guest session's progress without destroying it — it stays as a local backup.
window.__guestProgress=function(){
  try{const st=JSON.parse(localStorage.getItem(KEY+':'+GUEST_UID));return hasProgress(st)?st:null;}catch(e){return null;}
};
window.__adoptState=function(st){
  if(!st)return;
  S=normalizeState(st);migratePlanProgress();
  if(activeKey)localStorage.setItem(activeKey,JSON.stringify(S));
  renderAllViews();
};
window.__startGuest=function(){
  window.__user=null;activeEmail='';
  loadForUser(GUEST_UID);
  window.__hideAuth();renderAllViews();renderStorageBar();
};
window.__showAuth=function(){
  const o=document.getElementById('authbar'); if(o)o.classList.add('on');
  const e=document.getElementById('autherr'); if(e)e.textContent='';
  const em=document.getElementById('auth-email'); if(em)em.focus();
};
window.__hideAuth=function(){
  const o=document.getElementById('authbar'); if(o)o.classList.remove('on');
  const e=document.getElementById('autherr'); if(e)e.textContent='';
};
window.__toggleAuth=function(){

};
window.__onLogout=function(){

  window.__syncStatus='';

};
window.__authError=function(msg){ const e=document.getElementById('autherr'); if(e)e.textContent=msg||'Something went wrong. Try again.'; };
window.__syncState=function(state){window.__syncStatus=state;renderStorageBar();};
window.__needConfig=function(){
  const c=document.getElementById('cfgnote'); if(c)c.style.display='inline';
  ['g-signin','auth-email','auth-pass','e-signin','e-register','e-reset']
    .forEach(id=>{const e=document.getElementById(id); if(e)e.style.display='none';});
};
const SERVER = false;
let serverTimer, serverOK=false;
async function serverPing(){try{const r=await fetch('/ping',{cache:'no-store'});serverOK=r.ok;}catch(e){serverOK=false;}return serverOK;}
async function serverLoad(){
  try{const r=await fetch('/load',{cache:'no-store'});if(r.ok){const j=await r.json();serverOK=true;
    if(j&&Object.keys(j).length){S=normalizeState(j);if(activeKey)localStorage.setItem(activeKey,JSON.stringify(S));}}}
  catch(e){serverOK=false;}
}
function scheduleServerSave(){if(!SERVER)return;clearTimeout(serverTimer);serverTimer=setTimeout(serverSave,350)}
async function serverSave(){

/* ---------- robust file persistence (File System Access API) ---------- */
let fileHandle=null, fileName='';
function fsaSupported(){return 'showSaveFilePicker' in window}
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('ipcc_fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){try{const db=await idbOpen();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
async function idbGet(k){try{const db=await idbOpen();return await new Promise((res,rej)=>{const t=db.transaction('kv','readonly');const q=t.objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
async function idbDel(k){try{const db=await idbOpen();await new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=res})}catch(e){}}

async function connectFile(){
  if(!fsaSupported()){alert('Auto-save to a file needs Chrome or Edge. On any browser you can still use Export / Import to back up.');return}
  try{
    const h=await window.showSaveFilePicker({suggestedName:'Interview_Prep_progress.json',
      types:[{description:'Progress JSON',accept:{'application/json':['.json']}}]});
    let existing=null;
    try{const f=await h.getFile();const txt=await f.text();if(txt.trim())existing=JSON.parse(txt)}catch(e){}
    if(existing&&Object.keys(existing).length){
      if(confirm('This file already has saved progress.\n\nOK = load it into the app.\nCancel = overwrite it with your current progress.')){
        S=normalizeState(existing);if(activeKey)localStorage.setItem(activeKey,JSON.stringify(S));
      }
    }
    fileHandle=h;fileName=h.name;await idbSet('handle',h);
    await writeFile();renderAllViews();renderStorageBar();
  }catch(e){if(e&&e.name!=='AbortError')alert('Could not open the file picker here. If you opened this page directly from disk, your browser may block file access. Use Export / Import instead, or open it through a local web server.')}

async function disconnectFile(){fileHandle=null;fileName='';await idbDel('handle');renderStorageBar()}
let fileTimer;
function scheduleFileWrite(){if(!fileHandle)return;clearTimeout(fileTimer);fileTimer=setTimeout(writeFile,400)}
async function writeFile(){
  if(!fileHandle)return;
  try{
    if(fileHandle.queryPermission){let p=await fileHandle.queryPermission({mode:'readwrite'});
      if(p!=='granted'){p=await fileHandle.requestPermission({mode:'readwrite'});if(p!=='granted'){renderStorageBar(true);return}}}
    const w=await fileHandle.createWritable();await w.write(JSON.stringify(S,null,2));await w.close();
    setFileStatus('saved to file ✓');
  }catch(e){setFileStatus('file save failed; kept in browser')}
}

    if(txt.trim()){S=normalizeState(JSON.parse(txt));if(activeKey)localStorage.setItem(activeKey,JSON.stringify(S));renderAllViews()}}catch(e){}
}
async function tryReconnect(){

}

function renderStorageBar(needReconnect){

  }

/* ---------- helpers ---------- */
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
function escapeHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function daysBetween(a,b){return Math.round((b-a)/86400000)}
function currentWeekIdx(){if(!WEEKS.length)return 0;const now=new Date();const st=getStart();if(now<st)return 0;const w=Math.floor(daysBetween(st,now)/7);return Math.min(Math.max(w,0),WEEKS.length-1)}

/* ---------- progress math ---------- */
function weekStamp(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return dateKey(x)}

  const base=(t&&t.id)||(t&&t._key)||w.id+'s'+si+'#'+ti;

}
function taskSkipped(w,si,ti,t){return !!S.skippedTasks[tkey(w,si,ti,t)]}
function weekTotal(i){let n=0;const w=WEEKS[i];w.sessions.forEach((s,si)=>s.x.forEach((task,ti)=>{if(isCoreTask(task)&&!taskSkipped(w,si,ti,task))n++}));return n}
function weekDone(i){const w=WEEKS[i];let d=0;w.sessions.forEach((s,si)=>s.x.forEach((t,ti)=>{if(isCoreTask(t)&&!taskSkipped(w,si,ti,t)&&S.weekTasks[tkey(w,si,ti,t)])d++}));return d}
function reserveMinutes(profile){
  const s=(profile.calendarReserve||'').toLowerCase();const h=s.match(/(\d+)h(?:\s*(\d+)m)?/);if(h)return Number(h[1])*60+Number(h[2]||0);
  const nums=(s.match(/\d+/g)||[]).map(Number);return nums.length?Math.max(...nums):0;
}
function weekReserve(i){const w=WEEKS[i];let m=0;w.sessions.forEach((s,si)=>s.x.forEach((t,ti)=>{if(isCoreTask(t)&&!taskSkipped(w,si,ti,t))m+=reserveMinutes(timingProfile(w,s,t));}));return m;}
function reserveLabel(m){return m>=60?`${Math.floor(m/60)}h${m%60?String(m%60).padStart(2,'0')+'m':''}`:`${m}m`;}
function sessDone(w,si){let d=0;w.sessions[si].x.forEach((t,ti)=>{if(S.weekTasks[tkey(w,si,ti,t)]||taskSkipped(w,si,ti,t))d++});return d}
function sessCoreTotal(w,si){let n=0;w.sessions[si].x.forEach((t,ti)=>{if(isCoreTask(t)&&!taskSkipped(w,si,ti,t))n++});return n}
function sessCoreDone(w,si){let d=0;w.sessions[si].x.forEach((t,ti)=>{if(isCoreTask(t)&&!taskSkipped(w,si,ti,t)&&S.weekTasks[tkey(w,si,ti,t)])d++});return d}
function planPct(){let t=0,d=0;WEEKS.forEach((w,i)=>{if(w.id==='live')return;t+=weekTotal(i);d+=weekDone(i)});return t?d/t:0}
function topicsPct(){let t=TOPICS.length*2,d=0;TOPICS.forEach((_,i)=>{const o=S.topics[i]||{};if(o.explain)d++;if(o.implement)d++});return t?d/t:0}
function storyPct(){let d=0;STORY_CATS.forEach(c=>{if(S.storyReady[c])d++});return STORY_CATS.length?d/STORY_CATS.length:0}
function resPct(){let t=0,d=0;RESOURCES.forEach((g,gi)=>g.items.forEach((_,ii)=>{t++;if(S.resReviewed[gi+'#'+ii])d++}));return t?d/t:0}
function leetCount(){return S.leet.filter(r=>r.unaided==='Y'||r.problem).length}
function gatePct(){return GATES.length?GATES.filter(g=>(S.gates[g.id]||{}).status==='pass').length/GATES.length:0}
function orderedGates(){
  const wi=id=>{const n=WEEKS.findIndex(w=>w.id===id);return n<0?999:n;};
  return [...GATES].sort((a,b)=>wi(a.week)-wi(b.week)||a.id.localeCompare(b.id,undefined,{numeric:true}));

function sessionParts(si,rawTitle,s){

    .replace(/^(?:~?\d+h(?:\d+m)?|~?\d+m|\d+×\d+m)(?:\s+(?:including breaks|calendar reserve))?\s+—\s+/i,'');
  return {day,content};
}
function timingProfile(w,s,t){
  const id=(t&&t.id)||'';const profiles=TIMING.profiles||{};
  let name='standard';
  if((TIMING.staminaTaskIds||[]).includes(id))name='stamina';
  else if(t&&t.codingProblem)name='strict';
  else if((TIMING.strictTaskIds||[]).includes(id)||t.gate||/-DSA$/.test(id))name='strict';
  else if((TIMING.deepTaskIds||[]).includes(id))name='deep';
  else if(/-OUT$/.test(id)||/^Fri\b/.test(s.t)||w.id==='w8'||w.id==='w12'||['LIVE-2','LIVE-4'].includes(id))name='brief';
  const profile=Object.assign({label:name,workWindow:'40–65m',calendarReserve:'75m',rhythm:'Two focus cycles',stopRule:''},profiles[name]||{},{name});
  if(t&&t.workWindow)profile.workWindow=t.workWindow;
  if(t&&t.calendarReserve)profile.calendarReserve=t.calendarReserve;
  if(t&&t.codingProblem)profile.stopRule=`Stop the attempt at ${t.attemptMinutes} minutes. Use the remaining reservation for tests, review and the log.`;
  return profile;
}
function flexibleTaskText(raw,profile){
  if(profile.name==='strict'||profile.name==='stamina')return raw;
  let step=0;const cues=['First','Next','Then','Finish'];
  return raw
    .replace(/<strong>([^<]*?) \(\d+(?:–\d+)?m(?: total)?\)(:\s*<\/strong>)/g,'<strong>$1$2')
    .replace(/\b\d+\s*min:/g,()=>cues[Math.min(step++,cues.length-1)]+':')

    .replace(/Use the final \w+ minutes/g,'At the end')
    .replace(/Use the remaining time/g,'For the final step');
}
function humanTaskHtml(raw){
  const parts=[];const re=/<strong>([^<]+)<\/strong>\s*([\s\S]*?)(?=<strong>|$)/g;let m;
  while((m=re.exec(raw)))parts.push({at:m.index,label:m[1].replace(/:\s*$/,''),copy:m[2].trim()});
  if(parts.length>=2&&parts[0].at===0){
    return '<div class="task-steps">'+parts.map(p=>`<div class="task-step"><span class="step-label">${p.label}</span><span class="step-copy">${p.copy}</span></div>`).join('')+'</div>';

}
let ACTIVE_FOCUS={key:'',startedAt:0};let focusTicker=null;let focusPaintTicks=0;
function focusSeconds(key){

}
function focusClockText(sec){const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function checkpointFocus(){

}
function paintFocusClocks(){
  document.querySelectorAll('[data-focus-clock]').forEach(n=>{const key=n.dataset.focusClock;n.textContent=focusClockText(focusSeconds(key));n.classList.toggle('active',ACTIVE_FOCUS.key===key);});
  focusPaintTicks++;if(focusPaintTicks%15===0)checkpointFocus();
}
function pauseFocus(){

  clearInterval(focusTicker);focusTicker=null;save();

function startFocus(key){

function renderFocusBar(copy,key,profile){

function renderSession(parent,w,si,onlyTi=null){

/* ---------- render: retrieval cards ---------- */
function addDaysISO(n){
  const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return dateKey(d);
}
function renderCards(){
  const v=document.getElementById('v-cards');if(!v)return;v.innerHTML='';
  const today=dateKey(new Date());
  const due=S.cards.filter(c=>!c.due||c.due<=today).length;
  v.appendChild(el('div','note',`<strong>${due} due now.</strong> Friday pulls start with due cards, then the oldest unseen cards. “Missed” returns tomorrow; “Got it” returns in seven days. Add cards from any curriculum task so the source ID is preserved.`));
  const toolbar=el('div','toolbar');const add=el('button','btn accent sm','+ New card');
  add.onclick=()=>{S.cards.unshift({prompt:'',answer:'',source:'manual',due:today,last:''});save();renderCards();};
  toolbar.append(add);v.appendChild(toolbar);
  if(!S.cards.length){v.appendChild(el('div','empty','You have not created a retrieval card yet. Open a curriculum task and choose “Add retrieval card.”'));return;}
  const ordered=S.cards.map((card,index)=>({card,index})).sort((a,b)=>(a.card.due||'').localeCompare(b.card.due||''));
  ordered.forEach(({card,index})=>{
    const isDue=!card.due||card.due<=today;
    const c=el('div','card'+(isDue?' due':''));
    const head=el('div','wkhead');
    const source=el('span','idtag',card.source||'manual');
    const dueLabel=el('span','pill',isDue?'Due now':'Due '+card.due);
    head.append(source,dueLabel);c.appendChild(head);
    const prompt=el('textarea');prompt.className='cardprompt';prompt.style.cssText='width:100%;min-height:48px;margin-top:10px';prompt.placeholder='Question / retrieval cue';prompt.value=card.prompt||'';
    prompt.oninput=()=>{card.prompt=prompt.value;save()};c.appendChild(prompt);
    const answerBox=el('details');answerBox.appendChild(el('summary',null,'Show / edit answer'));
    const answer=el('textarea');answer.style.cssText='width:100%;min-height:80px;margin-top:8px';answer.placeholder='Answer in 40 words or fewer';answer.value=card.answer||'';
    answer.oninput=()=>{card.answer=answer.value;save()};answerBox.appendChild(answer);c.appendChild(answerBox);
    const dueInput=el('input');dueInput.type='date';dueInput.value=card.due||today;dueInput.onchange=()=>{card.due=dueInput.value;save();renderCards();};
    const dueWrap=el('label','setlbl','Next review');dueWrap.appendChild(dueInput);c.appendChild(dueWrap);
    const actions=el('div','row-actions');
    const miss=el('button','btn sm','Missed → tomorrow');miss.onclick=()=>{card.last=today;card.due=addDaysISO(1);save();renderCards();};
    const got=el('button','btn accent sm','Got it → 7 days');got.onclick=()=>{card.last=today;card.due=addDaysISO(7);save();renderCards();};
    const del=el('button','btn sm','Delete');del.onclick=()=>{if(confirm('Delete this retrieval card?')){S.cards.splice(index,1);save();renderCards();}};
    actions.append(miss,got,del);c.appendChild(actions);v.appendChild(c);
  });
}

  name.oninput=()=>{s.name=name.value;save();const sub=document.getElementById('sub');if(sub)sub.textContent=s.name||'Interview Prep';};
  nameW.appendChild(name);c.appendChild(nameW);
  const dRow=el('div','setrow');
  const mkDate=(lbl,key)=>{const w=el('div');w.innerHTML='<label class="setlbl">'+lbl+'</label>';
    const i=el('input');i.type='date';i.value=s[key]||'';
    i.onchange=()=>{if(i.value){s[key]=i.value;save();renderAllViews();}};w.appendChild(i);return w;};
  dRow.appendChild(mkDate('Start date (Week 0 begins)','startDate'));
  dRow.appendChild(mkDate('Target interview date','targetDate'));
  c.appendChild(dRow);v.appendChild(c);

  const tc=el('div','card');tc.appendChild(el('h3',null,'Target companies'));
  tc.appendChild(el('div',null,'<div class="muted" style="font-size:12.5px;margin-bottom:8px">Use these for company-specific plan wording. Keep broader pipeline tracking in the Companies tab.</div>'));
  const tcRow=el('div','setrow');
  TARGET_COMPANY_FIELDS.forEach(([k,label,ph])=>{
    const w=el('div');
    w.innerHTML='<label class="setlbl">'+label+'</label>';
    const inp=el('input');inp.type='text';inp.value=cfg[k]||'';inp.placeholder=ph||'';
    inp.oninput=()=>{cfg[k]=inp.value;save();refreshAll();};
    w.appendChild(inp);tcRow.appendChild(w);
  });
  tc.appendChild(tcRow);v.appendChild(tc);

  /* ---- Personalization: variable substitutions ---- */
  const varDefs=(PERSONALIZATION&&PERSONALIZATION.vars)||{};
  const targetKeys=TARGET_COMPANY_FIELDS.map(f=>f[0]);
  const varKeys=Object.keys(varDefs).filter(k=>!targetKeys.includes(k));
  if(varKeys.length){
    const pc=el('div','card');pc.appendChild(el('h3',null,'Personalize the plan'));
    pc.appendChild(el('div',null,'<div class="muted" style="font-size:12.5px;margin-bottom:8px">Names and labels you enter here are substituted into every task. Leave a field blank to keep the generic label.</div>'));
    const pRow=el('div','setrow');
    varKeys.forEach(k=>{
      const def=varDefs[k]||{};
      const w=el('div');
      w.innerHTML='<label class="setlbl">'+(def.label||k)+'</label>';
      const inp=el('input');inp.type='text';inp.value=cfg[k]||'';inp.placeholder=def.default||'';
      inp.oninput=()=>{cfg[k]=inp.value;save();refreshAll();};
      w.appendChild(inp);pRow.appendChild(w);
    });
    pc.appendChild(pRow);v.appendChild(pc);
  }

  /* ---- Personalization: branchable weeks (e.g. W9 interp vs post-training) ---- */
  const branchDefs=(PERSONALIZATION&&PERSONALIZATION.branches)||{};
  const branchKeys=Object.keys(branchDefs);
  if(branchKeys.length){
    const bc=el('div','card');bc.appendChild(el('h3',null,'Weekly focus options'));
    branchKeys.forEach(k=>{
      const def=branchDefs[k]||{};
      const w=el('div');
      w.innerHTML='<label class="setlbl">'+(def.label||k)+'</label>'+(def.help?'<div class="muted" style="font-size:12px;margin:0 0 6px">'+def.help+'</div>':'');
      const sel=el('select');
      (def.options||[]).forEach(o=>{const op=el('option',null,o.label);op.value=o.id;sel.appendChild(op);});
      if(!cfg.branches)cfg.branches={};
      sel.value=cfg.branches[k]||def.default||'';
      sel.onchange=()=>{cfg.branches[k]=sel.value;save();rebuildWeeks();renderAllViews();};
      w.appendChild(sel);bc.appendChild(w);
    });
    v.appendChild(bc);
  }

  const dc=el('div','card');dc.appendChild(el('h3',null,'Study days'));
  dc.appendChild(el('div',null,'<div class="muted" style="font-size:12.5px;margin-bottom:8px">Each row sets the weekday for a session slot. The plan ships with Mon–Sun; remap if your study week is shifted (e.g., weekend off Wed/Thu).</div>'));
  const slotLabels=[
    'Slot 1: weeknight (default Mon)',
    'Slot 2: weeknight LeetCode (default Tue)',
    'Slot 3: weeknight (default Wed)',
    'Slot 4: weeknight (default Thu)',
    'Slot 5: Friday rotation (default Fri)',
    'Slot 6: long block A (default Sat)',
    'Slot 7: long block B (default Sun)'
  ];
  const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const grid=el('div','setdays');
  slotLabels.forEach((lbl,i)=>{
    const w=el('div');w.innerHTML='<label class="setlbl">'+lbl+'</label>';
    const sel=el('select');DOW.forEach(d=>{const o=el('option',null,d);o.value=d;sel.appendChild(o)});
    sel.value=s.days[i]||DOW[i];
    sel.onchange=()=>{s.days[i]=sel.value;save();renderAllViews();};
    w.appendChild(sel);grid.appendChild(w);
  });
  dc.appendChild(grid);v.appendChild(dc);

  const rc=el('div','card');
  const rb=el('button','btn sm','Reset dates & days to defaults');
  rb.onclick=()=>{s.startDate=DEF_START;s.targetDate=DEF_TARGET;s.days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];save();renderAllViews();show('settings');};
  rc.appendChild(rb);v.appendChild(rc);

  const data=el('div','card');data.appendChild(el('h3',null,'Data and privacy'));
  const privacy=el('p','muted');privacy.textContent=`Signed in as ${activeEmail||'—'}. Progress is stored under your account and cached locally using an account-specific key.`;data.appendChild(privacy);
  const actions=el('div','row-actions');
  const exp=el('button','btn sm','Download backup');exp.type='button';exp.onclick=exportData;
  const imp=el('button','btn sm','Import backup');imp.type='button';imp.onclick=importData;
  actions.append(exp,imp);data.appendChild(actions);v.appendChild(data);
}

/* ---------- refresh ---------- */
function refreshAll(){
  refreshHeader();
  const active=document.querySelector('.view.on');
  const id=active?active.id.replace('v-',''):'dash';
  const renders={dash:renderDash,plan:renderPlan,topics:renderTopics,leet:renderLeet,mocks:renderMocks,
    pipe:renderPipe,story:renderStory,cards:renderCards,gates:renderGates,evidence:renderEvidence,protocol:renderProtocol,res:renderRes,more:renderMore,settings:renderSettings};
  if(renders[id])renders[id]();
}

/* ---------- init ---------- */
buildNav();
// Open the app immediately as a guest. Firebase may replace this with a real session later.
window.__startGuest();
// The plan ships with the page, so it loads without an account.
window.__planReady=(async function bootPlan(){
  try{
    const r=await fetch('plan.json',{cache:'no-store'});
    if(r.ok){window.__applyPlan(await r.json());return;}
  }catch(e){}
  if(!window.__hasPlan())window.__planMissing();
})();
renderStorageBar();
document.addEventListener('keydown',e=>{if(e.key==='Escape')window.__hideAuth();});
window.addEventListener('beforeunload',checkpointFocus);
const initial=(location.hash||'#dash').slice(1);
show(KNOWN_TABS.has(initial)?initial:'dash');
window.addEventListener('hashchange',()=>{
  const id=(location.hash||'#dash').slice(1);
  if(KNOWN_TABS.has(id))show(id);
});
</script>

    let userRef=null, unsub=null, writeTimer=null;
    const friendly=(e)=>{const c=(e&&e.code)||'';const m=(e&&e.message)||'';
      if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')) return 'Could not sign in with that email and password.';
      if(c.includes('email-already-in-use')) return 'Could not create the account. Try signing in or resetting the password.';

      if(c.includes('network-request-failed')) return 'The network request failed. Check your connection or ad/script blocker.';

      if(c.includes('web-storage-unsupported')||c.includes('missing-initial-state')||m.includes('missing initial state')) return 'Your browser blocked the Google sign-in handoff (common on iPhone Safari or private browsing). Use email/password to sign in instead.';
      if(c.includes('unauthorized-domain')) return 'This domain isn\'t authorized: add it in Firebase → Authentication → Settings → Authorized domains.';
      return 'Sign-in failed: '+(c||m||'unknown error');};

    window.__signInGoogle=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>window.__authError(friendly(e)));

    window.__signOut=()=>signOut(auth);
    window.__cloudSave=(state)=>{ if(!userRef)return; clearTimeout(writeTimer);

        }catch(e){ window.__authError(friendly(e)); }
        if(unsub)unsub();
        unsub=onSnapshot(userRef,(s)=>{ if(s.metadata.hasPendingWrites)return;

      } else {
        if(unsub){unsub();unsub=null;} userRef=null;window.__syncStatus='';window.__onLogout();
      }
    });
